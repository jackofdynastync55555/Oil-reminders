        'Use the button above if you\u2019d rather freeze the list and remove a few by hand.</div>';
    } else if (r.assetMode === "groups") {
      var gsel = {}; (r.groupIds||[]).forEach(function (id){ gsel[id]=true; });
      var groupRows = "";
      var groupCount = 0;
      walkGroupTree(function (gid, gname, depth) {
        groupCount++;
        var count = devicesInGroup(all, gid).length;
        var on = !!gsel[gid];
        groupRows +=
          '<label style="display:flex; align-items:center; gap:9px; padding:5px 8px; padding-left:'+(8 + depth*20)+'px; border-radius:7px; cursor:pointer; background:'+(on?C.brandSoft:"transparent")+';">' +
            (depth ? '<span style="color:'+C.faint+'; font-size:11px; margin-left:-13px; width:9px;">\u2514</span>' : '') +
            '<input type="checkbox" data-rpgroup="'+esc(gid)+'" '+(on?"checked":"")+' style="width:15px;height:15px; flex:none;">' +
            '<span style="font-size:13px; color:'+(count?C.ink:C.faint)+'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(gname)+'</span>' +
            '<span style="flex:1;"></span>' +
            '<span style="font-size:11.5px; color:'+C.faint+'; font-variant-numeric:tabular-nums; flex:none;">'+count+'</span></label>';
      });
      picker =
        '<div style="display:flex; gap:8px; align-items:center; margin-top:11px;">' +
          '<span style="font-size:11px; color:'+C.faint+';">Selecting a group includes its sub-groups. Counts are vehicles in that branch.</span>' +
          '<span style="flex:1;"></span>' +
          '<button id="rp-gclear" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer;">Clear</button>' +
        '</div>' +
        '<div style="margin-top:8px; max-height:300px; overflow:auto; border:1px solid '+C.line+'; border-radius:9px; padding:5px; background:'+C.card2+';">' +
        (groupRows || '<div style="padding:12px; color:'+C.soft+'; font-size:12.5px;">No groups found.</div>') + '</div>';
    } else if (r.assetMode === "assets") {
      var dsel = {}; (r.deviceIds||[]).forEach(function (id){ dsel[id]=true; });
      var ft = assetFilterText.toLowerCase();
      var shown = all.filter(function (d){ return !ft || String(d.name||"").toLowerCase().indexOf(ft) >= 0; });
      // group the asset list under its Geotab group so the tree is still visible
      var byGroup = {}, groupOrder = [];
      shown.forEach(function (d) {
        var g = devicePrimaryGroup(d.id);
        var key = g.path && g.path.length ? g.path.join(" \u203a ") : (g.name || "Ungrouped");
        if (!byGroup[key]) { byGroup[key] = []; groupOrder.push(key); }
        byGroup[key].push(d);
      });
      groupOrder.sort(function (a,b){ return a.localeCompare(b); });
      var assetRows = groupOrder.map(function (key) {
        var list = byGroup[key].slice().sort(function (a,b){ return String(a.name).localeCompare(String(b.name), undefined, {numeric:true}); });
        var onCount = list.filter(function (d){ return dsel[d.id]; }).length;
        return '<div style="display:flex; align-items:center; gap:8px; padding:7px 8px 4px;">' +
            '<span style="font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:'+C.brand+';">'+esc(key)+'</span>' +
            '<span style="flex:1; height:1px; background:'+C.line+';"></span>' +
            '<button data-rpgpick="'+esc(key)+'" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:6px; padding:2px 8px; font-size:10.5px; font-weight:650; cursor:pointer;">'+(onCount===list.length?"None":"All")+'</button>' +
          '</div>' +
          list.map(function (d) {
            return '<label style="display:flex; align-items:center; gap:9px; padding:5px 8px 5px 18px; border-radius:7px; cursor:pointer; background:'+(dsel[d.id]?C.brandSoft:"transparent")+';">' +
              '<input type="checkbox" data-rpasset="'+esc(d.id)+'" '+(dsel[d.id]?"checked":"")+' style="width:15px;height:15px; flex:none;">' +
              '<span style="font-size:13px; color:'+C.ink+'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(d.name)+'</span></label>';
          }).join("");
      }).join("");
      picker =
        '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:11px;">' +
          '<input id="rp-search" type="text" value="'+esc(assetFilterText)+'" placeholder="Filter assets\u2026" style="'+inputCss+' flex:1; min-width:170px;">' +
          '<button id="rp-all" style="'+addBtnCss+'">Select all'+(ft?" shown":"")+'</button>' +
          '<button id="rp-none" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Clear</button>' +
          '<select id="rp-addgroup" style="'+inputCss+'"><option value="">+ Add a whole group\u2026</option>' +
            (function () { var o = ""; walkGroupTree(function (gid, gname, depth) {
              var c = devicesInGroup(all, gid).length;
              o += '<option value="'+esc(gid)+'">'+"\u00a0\u00a0".repeat(depth)+esc(gname)+' ('+c+')</option>';
            }); return o; })() +
          '</select>' +
        '</div>' +
        '<div style="margin-top:9px; max-height:320px; overflow:auto; border:1px solid '+C.line+'; border-radius:9px; padding:5px; background:'+C.card2+';">' +
          (assetRows || '<div style="padding:12px; color:'+C.soft+'; font-size:12.5px;">No assets match that filter.</div>') + '</div>';
    }

    // ---- preview panel ----
    var rows = buildReportRows(selected);
    var td = 'padding:5px 9px; border-top:1px solid '+C.line+';';
    var previewRows = rows.slice(0, 6).map(function (x) {
      return '<tr>' +
        '<td style="'+td+' color:'+C.ink+'; white-space:nowrap;">'+esc(x.name)+'</td>' +
        '<td style="'+td+' color:'+C.soft+';">'+esc(x.status)+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.remaining==null?"\u2014":fmt(x.remaining))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.odo==null?"\u2014":fmt(x.odo))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; white-space:nowrap;">'+esc(fmtServiceDate(x.lastDate))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.lastOdo==null?"\u2014":fmt(x.lastOdo))+'</td>' +
      '</tr>';
    }).join("");
    var th = 'padding:5px 9px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:'+C.faint+'; text-align:left;';
    var preview =
      '<div style="overflow:auto; border:1px solid '+C.line+'; border-radius:9px; background:'+C.card2+';">' +
      '<table style="width:100%; border-collapse:collapse; font-size:12.5px;"><thead><tr>' +
        '<th style="'+th+'">Asset</th><th style="'+th+'">Status</th>' +
        '<th style="'+th+' text-align:right;">Mi. remaining</th><th style="'+th+' text-align:right;">Odometer</th>' +
        '<th style="'+th+'">Last oil change</th><th style="'+th+' text-align:right;">At odometer</th>' +
      '</tr></thead><tbody>'+(previewRows || '<tr><td colspan="6" style="padding:12px; color:'+C.soft+';">No assets selected.</td></tr>')+'</tbody></table></div>' +
      (rows.length > 6 ? '<div style="font-size:11px; color:'+C.faint+'; margin-top:7px;">Showing 6 of '+rows.length+' rows.</div>' : '') +
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;">' +
        '<button id="rp-save" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:650; cursor:pointer;">Save schedule</button>' +
        '<button id="rp-csv" style="border:1px solid '+C.line+'; background:transparent; color:'+C.ink+'; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;">Download CSV now</button>' +
        '<button id="rp-test" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;">Send test on next run</button>' +
      '</div>';

    reportEl.innerHTML =
      panel("Schedule",
        "The Excel file is built and emailed by the automation script. It fires on the first scheduled run at or after this time, and only once per period \u2014 so the report can never double-send even if the job runs hourly.",
        schedule) +
      panel("Assets in the report", "Pick the whole fleet, one or more groups, or individual assets.", modeRow + picker) +
      panel("Columns &amp; preview", "The workbook has two sheets. <b>Fleet Summary</b>: asset, status, mileage remaining before oil change, odometer, and when the last oil change was done and at what mileage. <b>Service History</b>: every service on every asset \u2014 the oil change plus each custom reminder \u2014 with its interval, status, and last completion. Preview below shows sheet 1 from currently loaded data.", preview);

    // ---- wiring ----
    function bindVal(id, key, transform) {
      var el = $(id); if (!el) return;
      el.addEventListener("change", function () {
        r[key] = transform ? transform(el.value) : el.value;
        renderReport(devices);
      });
    }
    var en = $("rp-enabled");
    if (en) en.addEventListener("change", function () {
      var val = en.checked;
      if (val && !(r.recipients||"").trim() && !(globalSettings.defaultEmailTo||"").trim()) {
        en.checked = false;
        toast("Set report recipients, or a fleet default in Settings, before turning this on");
        return;
      }
      if (val && !selectedReportDevices(all, r).length) {
        en.checked = false; toast("Select at least one asset before turning this on"); return;
      }
      r.enabled = val;
      // Flip-to-save: this is the master switch, so don't make it wait for Save.
      patchSettings({ report: JSON.parse(JSON.stringify(r)) })
        .then(function () { toast(val ? "Scheduled fleet report is ON" : "Scheduled fleet report turned off"); renderReport(devices); })
        .catch(function (e){ r.enabled = !val; toast("Save failed: "+(e&&e.message?e.message:e)); renderReport(devices); });
    });
    bindVal("rp-freq", "frequency");
    bindVal("rp-dow", "dayOfWeek", Number);
    bindVal("rp-tz", "timezone");
    var tm = $("rp-time"); if (tm) tm.addEventListener("change", function () { r.time = tm.value || "07:00"; });
    var to = $("rp-to"); if (to) to.addEventListener("change", function () { r.recipients = to.value.trim(); });
    bindVal("rp-mode", "assetMode");

    reportEl.querySelectorAll("[data-rpgroup]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-rpgroup");
        var set = (r.groupIds||[]).filter(function (x){ return x !== id; });
        if (cb.checked) set.push(id);
        r.groupIds = set; renderReport(devices);
      });
    });
    reportEl.querySelectorAll("[data-rpasset]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-rpasset");
        var set = (r.deviceIds||[]).filter(function (x){ return x !== id; });
        if (cb.checked) set.push(id);
        r.deviceIds = set; renderReport(devices);
      });
    });
    var addAll = $("rp-addall");
    if (addAll) addAll.addEventListener("click", function () {
      r.deviceIds = all.map(function (d){ return d.id; });
      r.assetMode = "assets";
      toast("Added all "+r.deviceIds.length+" assets \u2014 uncheck any you don\u2019t want");
      renderReport(devices);
    });
    var addGroups = $("rp-addgroups");
    if (addGroups) addGroups.addEventListener("click", function () {
      if (!selected.length) { toast("Select at least one group first"); return; }
      r.deviceIds = selected.map(function (d){ return d.id; });
      r.assetMode = "assets";
      toast("Added "+r.deviceIds.length+" asset"+(r.deviceIds.length===1?"":"s")+" from the selected group(s)");
      renderReport(devices);
    });
    var gclear = $("rp-gclear");
    if (gclear) gclear.addEventListener("click", function () { r.groupIds = []; renderReport(devices); });

    reportEl.querySelectorAll("[data-rpgpick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-rpgpick");
        var ft3 = assetFilterText.toLowerCase();
        var list = all.filter(function (d) {
          if (ft3 && String(d.name||"").toLowerCase().indexOf(ft3) < 0) return false;
          var g = devicePrimaryGroup(d.id);
          var k = g.path && g.path.length ? g.path.join(" \u203a ") : (g.name || "Ungrouped");
          return k === key;
        });
        var cur = (r.deviceIds||[]).slice();
        var allOn = list.every(function (d){ return cur.indexOf(d.id) >= 0; });
        if (allOn) {
          var drop = {}; list.forEach(function (d){ drop[d.id] = true; });
          r.deviceIds = cur.filter(function (id){ return !drop[id]; });
        } else {
          list.forEach(function (d){ if (cur.indexOf(d.id) < 0) cur.push(d.id); });
          r.deviceIds = cur;
        }
        renderReport(devices);
      });
    });

    var search = $("rp-search");
    if (search) {
      search.addEventListener("input", function () {
        assetFilterText = search.value;
        renderReport(devices);
        var s2 = $("rp-search");
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      });
    }
    var selAll = $("rp-all");
    if (selAll) selAll.addEventListener("click", function () {
      var ft2 = assetFilterText.toLowerCase();
      var ids = all.filter(function (d){ return !ft2 || String(d.name||"").toLowerCase().indexOf(ft2) >= 0; }).map(function (d){ return d.id; });
      var merged = (r.deviceIds||[]).slice();
      ids.forEach(function (id){ if (merged.indexOf(id) < 0) merged.push(id); });
      r.deviceIds = merged; renderReport(devices);
    });
    var selNone = $("rp-none");
    if (selNone) selNone.addEventListener("click", function () { r.deviceIds = []; renderReport(devices); });
    var addGroup = $("rp-addgroup");
    if (addGroup) addGroup.addEventListener("change", function () {
      var gid = addGroup.value; if (!gid) return;
      var allowed = groupWithDescendants(gid);
      var ids = all.filter(function (dev){ return (deviceGroups[dev.id]||[]).some(function (x){ return allowed[x]; }); }).map(function (d){ return d.id; });
      var merged = (r.deviceIds||[]).slice();
      var added = 0;
      ids.forEach(function (id){ if (merged.indexOf(id) < 0) { merged.push(id); added++; } });
      r.deviceIds = merged;
      toast("Added "+added+" asset"+(added===1?"":"s")+" from "+(names[gid]||"group"));
      renderReport(devices);
    });

    var save = $("rp-save");
    if (save) save.addEventListener("click", function () {
      // Pull straight from the inputs — if the user typed and clicked Save
      // without the field ever firing 'change', the draft could be stale.
      var tEl = $("rp-time"), toEl = $("rp-to");
      if (tEl && tEl.value) r.time = tEl.value;
      if (toEl) r.recipients = toEl.value.trim();
      if (r.enabled && !(r.recipients||"").trim() && !(globalSettings.defaultEmailTo||"").trim()) {
        toast("Set report recipients, or a fleet default in Settings, before enabling"); return;
      }
      if (r.enabled && !selectedReportDevices(all, r).length) { toast("No assets selected for the report"); return; }
      patchSettings({ report: JSON.parse(JSON.stringify(r)) })
        .then(function () { toast(r.enabled ? "Report schedule saved" : "Report schedule saved (disabled)"); })
        .catch(function (e){ toast("Save failed: "+(e&&e.message?e.message:e)); });
    });

    var csv = $("rp-csv");
    if (csv) csv.addEventListener("click", function () {
      var out = rows;
      if (!out.length) { toast("No assets selected"); return; }
      var head = ["Asset","Status","Mileage remaining before oil change ("+UNITS+")","Odometer reading ("+UNITS+")",
                  "Last oil change","Odometer at last oil change ("+UNITS+")"];
      function q(v){ v = (v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
      var lines = [head.map(q).join(",")].concat(out.map(function (x) {
        return [q(x.name), q(x.status), q(x.remaining==null?"":x.remaining), q(x.odo==null?"":x.odo),
                q(x.lastDate ? fmtServiceDate(x.lastDate) : ""), q(x.lastOdo==null?"":x.lastOdo)].join(",");
      }));
      // \ufeff so Excel opens it as UTF-8 rather than mangling the em dashes
      var blob = new Blob(["\ufeff"+lines.join("\r\n")], { type:"text/csv;charset=utf-8;" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "fleet-maintenance-"+new Date().toISOString().slice(0,10)+".csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function (){ URL.revokeObjectURL(url); }, 2000);
      toast("Downloaded "+out.length+" rows");
    });

    var test = $("rp-test");
    if (test) test.addEventListener("click", function () {
      var draft = JSON.parse(JSON.stringify(r));
      draft.testPending = true;
      patchSettings({ report: draft }).then(function () {
        reportDraft = draft;
        toast("Test queued \u2014 the next automation run will email the spreadsheet");
      }).catch(function (e){ toast("Failed: "+(e&&e.message?e.message:e)); });
    });
  }

  // ---- SETUP tab -------------------------------------------------------
  function colPanel(title, meta, inner) {
    return '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; box-shadow:'+C.shadow+'; overflow:hidden;">' +
      '<div style="display:flex; align-items:baseline; gap:9px; padding:12px 14px; border-bottom:1px solid '+C.line+';">' +
        '<span style="font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:'+C.soft+';">'+title+'</span>' +
        (meta ? '<span style="font-size:11.5px; color:'+C.faint+';">'+meta+'</span>' : '') +
      '</div><div style="padding:12px 14px;">'+inner+'</div></div>';
  }
  // iOS-style switch, used across the alert list.
  function switchEl(id, on) {
    return '<button data-switch="'+id+'" role="switch" aria-checked="'+(on?"true":"false")+'" ' +
      'style="flex:none; width:40px; height:22px; border-radius:999px; border:1px solid '+(on?C.brand:C.line)+'; ' +
      'background:'+(on?C.brand:C.track)+'; position:relative; cursor:pointer; padding:0;">' +
      '<span style="position:absolute; top:2px; left:'+(on?"20px":"2px")+'; width:16px; height:16px; border-radius:50%; ' +
      'background:'+(on?C.onBrand:"#63757e")+'; transition:left .15s ease;"></span></button>';
  }

  function renderSettings(devices) {
    if (!settingsEl) return;
    var autoOil = globalSettings.autoResetOil !== false;
    var autoCustom = globalSettings.autoResetCustom !== false;
    var cur = globalSettings.caution || "balanced";
    var cfg = CAUTION[cur] || CAUTION.balanced;

    // ---- column 1: caution profile ----
    var cautionRows = CAUTION_ORDER.map(function (key) {
      var c = CAUTION[key], on = key === cur;
      return '<div data-caution="'+key+'" style="display:flex; gap:10px; align-items:flex-start; padding:10px 11px; margin-bottom:8px; cursor:pointer; ' +
        'border:1px solid '+(on?C.brand+"8c":C.line)+'; border-radius:10px; background:'+(on?C.brandSoft:C.card2)+';">' +
        '<span style="flex:none; margin-top:1px; width:15px; height:15px; border-radius:50%; border:2px solid '+(on?C.brand:C.faint)+'; ' +
          'display:inline-flex; align-items:center; justify-content:center;">' +
          (on?'<span style="width:7px; height:7px; border-radius:50%; background:'+C.brand+';"></span>':'') + '</span>' +
        '<span><span style="font-size:13px; font-weight:650; color:'+(on?C.ink:C.soft)+';">'+c.label+'</span>' +
        '<div style="font-size:11.5px; color:'+C.faint+'; margin-top:2px; line-height:1.45;">'+c.blurb+'</div></span></div>';
    }).join("");
    var num = function (v){ return '<b style="color:'+C.brand+';">'+v+'</b>'; };
    var cautionPanel = cautionRows +
      '<div style="font-size:11.5px; color:'+C.faint+'; line-height:1.6; margin-top:4px;">In numbers: score shift ' +
      num(cfg.scoreShift > 0 ? "+"+cfg.scoreShift : cfg.scoreShift) + ', due now at ' + num(cfg.dueNowPct+"%") +
      ' of the interval left, due soon at ' + num(cfg.dueSoonPct+"%") + ', date rules ' + num(cfg.dateDays+" days") + ' out.</div>';

    // ---- column 2: alerts ----
    var alertRows = ALERT_DEFS.map(function (d, i) {
      var on = alertOn(d.id);
      return '<div style="display:flex; align-items:center; gap:12px; padding:11px 0;'+(i?' border-top:1px solid '+C.line+';':'')+'">' +
        '<span style="flex:1; min-width:0;"><span style="font-size:12.5px; font-weight:600; color:'+(on?C.ink:C.soft)+';">'+d.title+'</span>' +
        '<div style="font-size:11px; color:'+C.faint+'; margin-top:2px;">'+d.note+'</div></span>' +
        switchEl("alert:"+d.id, on) + '</div>';
    }).join("");
    var alertsPanel =
      '<div style="font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:'+C.soft+'; margin-bottom:6px;">Who gets them</div>' +
      '<input id="st-alert-to" type="text" value="'+esc(globalSettings.defaultEmailTo || "")+'" placeholder="shop@dynastync.com" ' +
        'style="width:100%; padding:8px 10px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';">' +
      '<div style="font-size:11.5px; color:'+C.faint+'; margin-top:6px; line-height:1.5;">Separate several with commas. If nothing needs attention no email goes out. Individual reminders can still override this.</div>' +
      '<div style="margin-top:6px;">'+alertRows+'</div>';

    // ---- column 3: fault overrides ----
    var sevChip = function (sev, muted) {
      var meta = RISK_META[sev] || RISK_META.medium;
      var col = meta.color==="red" ? C.red : meta.color==="amber" ? C.amber : C.faint;
      var bg  = meta.color==="red" ? C.redBg : meta.color==="amber" ? C.amberBg : C.track;
      if (muted) { col = C.faint; bg = C.track; }
      return '<span style="display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; ' +
        'padding:2px 8px; border-radius:999px; background:'+bg+'; color:'+col+'; border:1px solid '+col+'55; white-space:nowrap;">'+
        (muted?"Muted in alerts":meta.label)+'</span>';
    };
    var ovs = globalSettings.faultOverrides || [];
    var th2 = 'padding:6px 8px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:'+C.faint+'; text-align:left;';
    var ovRows = ovs.map(function (o, i) {
      return '<tr>' +
        '<td style="padding:9px 8px; border-top:1px solid '+C.line+'; vertical-align:top;">' +
          '<div style="font-size:12px; font-weight:650; color:'+C.ink+'; line-height:1.35;">'+esc(o.label || o.code)+'</div>' +
          (o.label && o.code ? '<div style="font-size:10.5px; color:'+C.faint+'; margin-top:2px;">'+esc(o.code)+'</div>' : '') +
        '</td>' +
        '<td style="padding:9px 8px; border-top:1px solid '+C.line+'; vertical-align:top;">' +
          sevChip(o.from) + ' <span style="color:'+C.faint+';">&rarr;</span> ' + sevChip(o.to, o.muted) +
        '</td>' +
        '<td style="padding:9px 8px; border-top:1px solid '+C.line+'; vertical-align:top; font-size:11.5px; color:'+C.soft+'; line-height:1.45;">' +
          esc(o.note || "") +
          '<div><button data-ovdel="'+i+'" style="margin-top:6px; border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:6px; padding:2px 9px; font-size:10.5px; font-weight:650; cursor:pointer;">Remove</button></div>' +
        '</td></tr>';
    }).join("");
    var sevOpts = function (sel) {
      return SEVERITIES.map(function (v) {
        return '<option value="'+v+'"'+(v===sel?" selected":"")+'>'+(RISK_META[v]?RISK_META[v].label:v)+'</option>';
      }).join("");
    };
    var ovPanel =
      '<div style="overflow:auto;"><table style="width:100%; border-collapse:collapse;"><thead><tr>' +
        '<th style="'+th2+'">Code</th><th style="'+th2+'">Severity</th><th style="'+th2+'">Why</th>' +
      '</tr></thead><tbody>' +
      (ovRows || '<tr><td colspan="3" style="padding:14px 8px; border-top:1px solid '+C.line+'; color:'+C.faint+'; font-size:12px;">No overrides. Faults use their Geotab severity, or the built-in rating when Geotab doesn\u2019t supply one.</td></tr>') +
      '</tbody></table></div>' +
      '<div style="margin-top:12px; padding-top:11px; border-top:1px solid '+C.line+';">' +
        '<div style="font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:'+C.soft+'; margin-bottom:7px;">Add an override</div>' +
        '<div style="display:grid; grid-template-columns:1fr 1fr; gap:7px;">' +
          '<input id="ov-code" type="text" placeholder="Code or name match, e.g. SPN 3251" style="'+inputCss+' width:100%;">' +
          '<input id="ov-label" type="text" placeholder="Label (optional)" style="'+inputCss+' width:100%;">' +
          '<select id="ov-from" style="'+inputCss+' width:100%;">'+sevOpts("medium")+'</select>' +
          '<select id="ov-to" style="'+inputCss+' width:100%;">'+sevOpts("high")+'</select>' +
        '</div>' +
        '<input id="ov-note" type="text" placeholder="Why \u2014 the reason this override exists" style="'+inputCss+' width:100%; margin-top:7px;">' +
        '<label style="display:flex; align-items:center; gap:8px; margin-top:8px; cursor:pointer;">' +
          '<input type="checkbox" id="ov-muted" style="width:15px;height:15px;">' +
          '<span style="font-size:12px; color:'+C.soft+';">Mute in alerts (still shown on the vehicle)</span></label>' +
        '<button id="ov-add" style="margin-top:9px; border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:650; cursor:pointer;">Add override</button>' +
      '</div>';

    // ---- reset behaviour + config summary (existing) ----
    var anyManual = !autoOil || !autoCustom;
    var banner = anyManual
      ? '<div style="background:'+C.purpleBg+'; border:1px solid '+C.purple+'55; border-radius:10px; padding:10px 13px; margin-bottom:12px;">' +
          '<span style="font-size:12.5px; font-weight:650; color:'+C.purple+';">Manual confirmation mode is on</span>' +
          '<div style="font-size:11.5px; color:'+C.soft+'; margin-top:3px; line-height:1.5;">Affected reminders stay overdue until someone marks them serviced or done. One email per item when it first comes due, not one per run.</div>' +
        '</div>'
      : "";
    var resetPanel =
      toggleRow("st-oil", autoOil, "Auto-reset oil change reminders",
        "On: when a vehicle passes its interval the counter rolls forward automatically and tracking continues.<br>" +
        "Off: the counter stays put and the vehicle keeps reading as overdue until someone clicks <b>Mark serviced now</b> on the <b>Oil</b> tab.") +
      '<div style="height:1px; background:'+C.line+';"></div>' +
      toggleRow("st-custom", autoCustom, "Auto-reset custom reminders",
        "On: a due service reminder resets itself and starts the next cycle.<br>" +
        "Off: it stays due until someone clicks <b>Mark done</b> on the <b>Service</b> tab.");

    var kv = function (k, v) {
      return '<div style="display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:12.5px;">' +
        '<span style="color:'+C.soft+';">'+k+'</span><span style="color:'+C.ink+'; font-weight:600;">'+v+'</span></div>';
    };
    var rp = globalSettings.report;
    var onCount = ALERT_DEFS.filter(function (d){ return alertOn(d.id); }).length;
    var statusPanel =
      kv("Caution profile", cfg.label) +
      kv("Oil reminders", autoOil ? "Automatic" : "Manual confirmation") +
      kv("Service reminders", autoCustom ? "Automatic" : "Manual confirmation") +
      kv("Alerts enabled", onCount + " of " + ALERT_DEFS.length) +
      kv("Fault overrides", ovs.length) +
      kv("Scheduled report", rp && rp.enabled
        ? (rp.frequency === "weekly" ? "Weekly" : "Daily") + " at " + esc(rp.time || "07:00")
        : "Off") +
      kv("Tracked assets", (cache.allDevices || []).length);

    settingsEl.innerHTML =
      banner +
      '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(310px, 1fr)); gap:11px; align-items:start; margin-bottom:11px;">' +
        colPanel("How cautious should we be?", null, cautionPanel) +
        colPanel("Alerts", null, alertsPanel) +
        colPanel("Fault overrides", "Per code, fleet-wide", ovPanel) +
      '</div>' +
      panel("Automatic reminder handling",
        "Controls whether the automation script may reset a reminder on its own when it comes due. Changes save immediately and apply on the next run.",
        resetPanel) +
      panel("Current configuration", null, statusPanel);

    // ---- wiring ----
    settingsEl.querySelectorAll("[data-caution]").forEach(function (el) {
      el.addEventListener("click", function () {
        var key = el.getAttribute("data-caution");
        if (key === globalSettings.caution) return;
        patchSettings({ caution: key })
          .then(function () { toast("Caution profile: "+CAUTION[key].label); reloadAll(); })
          .catch(function (e){ toast("Save failed: "+(e&&e.message?e.message:e)); });
      });
    });

    settingsEl.querySelectorAll("[data-switch]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-switch").replace(/^alert:/, "");
        var next = {};
        var curA = globalSettings.alerts || defaultAlerts();
        Object.keys(curA).forEach(function (k){ next[k] = curA[k]; });
        next[id] = !alertOn(id);
        patchSettings({ alerts: next })
          .then(function () { renderSettings(devices); })
          .catch(function (e){ toast("Save failed: "+(e&&e.message?e.message:e)); });
      });
    });

    var alertTo = $("st-alert-to");
    if (alertTo) alertTo.addEventListener("change", function () {
      patchSettings({ defaultEmailTo: alertTo.value.trim() || null })
        .then(function () { toast("Alert recipients saved"); });
    });

    var ovAdd = $("ov-add");
    if (ovAdd) ovAdd.addEventListener("click", function () {
      var code = ($("ov-code")||{}).value || "";
      if (!code.trim()) { toast("Enter a fault code or name to match"); return; }
      var next = (globalSettings.faultOverrides || []).slice();
      next.push({
        code: code.trim(),
        label: (($("ov-label")||{}).value || "").trim(),
        from: ($("ov-from")||{}).value || "medium",
        to: ($("ov-to")||{}).value || "high",
        muted: !!(($("ov-muted")||{}).checked),
        note: (($("ov-note")||{}).value || "").trim()
      });
      patchSettings({ faultOverrides: next })
        .then(function () { toast("Override added"); reloadAll(); })
        .catch(function (e){ toast("Save failed: "+(e&&e.message?e.message:e)); });
    });
    settingsEl.querySelectorAll("[data-ovdel]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var i = Number(btn.getAttribute("data-ovdel"));
        var next = (globalSettings.faultOverrides || []).slice();
        next.splice(i, 1);
        patchSettings({ faultOverrides: next }).then(function () { toast("Override removed"); reloadAll(); });
      });
    });

    var oilCb = $("st-oil");
    if (oilCb) oilCb.addEventListener("change", function () {
      var val = oilCb.checked;
      patchSettings({ autoResetOil: val })
        .then(function () { toast(val ? "Oil reminders will auto-reset" : "Oil reminders now need manual confirmation"); renderAll(); })
        .catch(function (e){ oilCb.checked = !val; toast("Save failed: "+(e&&e.message?e.message:e)); });
    });
    var cusCb = $("st-custom");
    if (cusCb) cusCb.addEventListener("change", function () {
      var val = cusCb.checked;
      patchSettings({ autoResetCustom: val })
        .then(function () { toast(val ? "Service reminders will auto-reset" : "Service reminders now need manual confirmation"); renderAll(); })
        .catch(function (e){ cusCb.checked = !val; toast("Save failed: "+(e&&e.message?e.message:e)); });
    });
  }

  // ---- theme + tabs --------------------------------------------------
  function $(id) { return document.getElementById(id); }
  // MyGeotab injects add-in markup into its own page, so our <body> rules can
  // be outranked by the host stylesheet and white gutters show around the app.
  // Walk up from #root making each ancestor transparent, then paint the page
  // itself dark. MyGeotab's own nav/header keeps its styling — we only touch
  // the containers our content actually sits inside.
  function paintHostDark() {
    try {
      var PAGE = "#05080b";
      var GRAD = PAGE;
      var node = rootEl ? rootEl.parentNode : null;
      var guard = 0;
      while (node && node.nodeType === 1 && guard++ < 40) {
        if (node === document.body || node === document.documentElement) break;
        node.style.background = "transparent";
        node.style.backgroundColor = "transparent";
        node.style.backgroundImage = "none";
        node = node.parentNode;
      }
      if (document.body) {
        document.body.style.background = GRAD;
        document.body.style.backgroundAttachment = "fixed";
        document.body.style.color = C.ink;
      }
      if (document.documentElement) document.documentElement.style.background = PAGE;
      if (bodyEl && bodyEl !== document.body) {
        bodyEl.style.background = "transparent";
        bodyEl.style.color = C.ink;
      }
    } catch (e) { console.warn("host theming skipped:", e && e.message); }
  }

  function applyTheme() {
    C = THEMES.dark;
    paintHostDark();
    if (bodyEl) bodyEl.style.color = C.ink;
    var lu = $("lastUpdated"); if (lu) lu.style.color = C.faint;
    var sub = $("brandSub"); if (sub) sub.style.color = C.faint;
    var rb = $("refreshBtn");
    if (rb) {
      rb.style.background = C.card;
      rb.style.border = "1px solid "+C.line;
      rb.style.color = C.soft;
    }
    ["groupSelect","rangeSelect"].forEach(function (id) {
      var el = $(id); if (!el) return;
      el.style.background = C.card; el.style.border = "1px solid "+C.line; el.style.color = C.ink;
    });
    var tabsWrap = $("tabs");
    if (tabsWrap) { tabsWrap.style.borderBottom = "1px solid "+C.line; tabsWrap.style.background = "transparent"; }
    styleBanner();
    styleTabs();
  }

  // Short plain-English line describing the tab you're on, in the accent bar
  // style the rest of the suite uses.
  var BANNERS = {
    health:   ["Fleet Health.", "Every asset ranked worst first \u2014 faults, service state and device health, with a per-vehicle breakdown one tap away."],
    oil:      ["Oil.", "Oil change tracking across the fleet. Set an interval once, apply it to a whole group, and confirm service when it's actually done."],
    custom:   ["Service.", "Any recurring job you want tracked \u2014 brakes, tires, DOT, filters. Up to "+MAX_CUSTOM_PER_ASSET+" per asset, by mileage or by time."],
    report:   ["Reporting.", "A scheduled Excel report of the whole fleet: status, mileage to next oil change, odometer, and when each service was last completed."],
    settings: ["Setup.", "Fleet-wide behaviour \u2014 whether reminders reset themselves or wait for manual confirmation, plus default recipients."]
  };
  function styleBanner() {
    var wrap = $("appBanner"), bar = $("appBannerBar"), txt = $("appBannerText");
    if (!wrap || !txt) return;
    var b = BANNERS[activeTab] || BANNERS.health;
    wrap.style.background = C.card;
    wrap.style.border = "1px solid "+C.line;
    if (bar) bar.style.background = C.brand;
    txt.innerHTML = '<span style="color:'+C.brand+'; font-weight:700;">'+b[0]+'</span> <span style="color:'+C.soft+';">'+b[1]+'</span>';
  }

  function styleTabs() {
    if (!healthEl) return;
    document.querySelectorAll("#tabs button").forEach(function (b) {
      var on = b.getAttribute("data-tab")===activeTab;
      b.style.background = "transparent";
      b.style.color = on ? C.ink : C.soft;
      b.style.borderBottom = on ? "2px solid "+C.brand : "2px solid transparent";
      b.style.marginBottom = "-1px";
    });
    styleTabCounts();
  }

  // Small count pills on the tab labels, matching the rest of the suite.
  function styleTabCounts() {
    var counts = {
      health: (cache.allDevices || []).length,
      oil: (cache.allDevices || []).filter(function (d) {
        var rec = cache.oilMap[d.id], det = rec && rec.details, odo = cache.odoMap[d.id];
        if (!det || det.enabled === false || odo == null) return false;
        var interval = det.intervalMiles || DEFAULT_INTERVAL_MILES;
        return (interval - (odo - det.lastNotifiedMeters)/METERS_PER_UNIT) <= soonWindow(interval);
      }).length,
      custom: (cache.customList || []).filter(function (r){ return r.details && r.details.deviceId; }).length
    };
    document.querySelectorAll("#tabs [data-count]").forEach(function (el) {
      var key = el.getAttribute("data-count");
      var n = counts[key];
      if (n == null || !n) { el.textContent = ""; el.removeAttribute("style"); return; }
      var on = key === activeTab;
      el.textContent = n;
      el.setAttribute("style",
        "display:inline-block; margin-left:7px; min-width:18px; text-align:center; padding:1px 6px; " +
        "border-radius:999px; font-size:10.5px; font-weight:800; line-height:1.5; " +
        "background:"+(on?C.brand:C.track)+"; color:"+(on?C.onBrand:C.soft)+";");
    });
  }

  var activeTab = "health";
  function switchTab(name) {
    activeTab = name;
    if (healthEl) healthEl.style.display = name==="health"?"":"none";
    if (oilEl) oilEl.style.display = name==="oil"?"":"none";
    if (customEl) customEl.style.display = name==="custom"?"":"none";
    if (reportEl) reportEl.style.display = name==="report"?"":"none";
    if (settingsEl) settingsEl.style.display = name==="settings"?"":"none";
    styleBanner();
    styleTabs();
  }

  // ---- orchestration -------------------------------------------------
  var cache = { devices:[], odoMap:{}, faultMap:{}, oilMap:{}, sensorMap:{}, customList:[], allDevices:[], rateMap:{} };
  function safe(p, fallback) { return Promise.resolve().then(function(){ return p; }).then(function (v){ return v; }).catch(function (e){ console.warn("call failed:", e&&e.message); return fallback; }); }

  function renderAll() {
    // apply group filter to the loaded device set, then render every tab
    var devices = filterByGroup(cache.allDevices);
    cache.devices = devices;
    renderHealth(devices, cache.odoMap, cache.faultMap, cache.oilMap, cache.sensorMap);
    if (oilEl) renderOil(devices, cache.odoMap, cache.oilMap, cache.sensorMap);
    if (customEl) renderCustom(devices, cache.odoMap, cache.customList);
    if (reportEl) renderReport(devices);
    if (settingsEl) renderSettings(devices);
    styleTabCounts();
  }

  function reloadAll() {
    if (!healthEl) return;
    healthEl.innerHTML = '<div style="text-align:center; color:'+C.soft+'; padding:34px 18px;">Loading fleet…</div>';
    Promise.all([ safe(getDevices(), []), safe(getGroups(), []) ]).then(function (r) {
      cache.allDevices = r[0];
      populateGroupSelect();
      var devices = cache.allDevices; // load data for ALL devices; filter at render time
      return Promise.all([ safe(getOdometers(devices),{}), safe(getFaults(devices),{}), safe(getOilState(),{}), safe(getSensors(devices),{}), safe(getCustom(),[]), safe(getGlobalSettings(),{settingsKey:"global",defaultEmailTo:null}), safe(getFuelLevels(devices),{}) ]);
    }).then(function (res) {
      cache.odoMap = res[0]; cache.faultMap = res[1]; cache.oilMap = res[2]; cache.sensorMap = res[3]; cache.customList = res[4]; globalSettings = res[5] || globalSettings; reportDraft = null; // re-seed the report editor from what was just loaded
      var fuelMap = res[6] || {};
      // merge dedicated fuel readings into the sensor map so the detail panel uses them
      Object.keys(fuelMap).forEach(function (id){
        if (!cache.sensorMap[id]) cache.sensorMap[id] = {};
        cache.sensorMap[id].fuel = fuelMap[id];
      });
      return safe(resolveDiagnostics(cache.faultMap), undefined).then(function () {
        // predictive mileage rates need the current odometer map
        return safe(getMileageRates(cache.allDevices, cache.odoMap), {});
      }).then(function (rates) {
        cache.rateMap = rates || {};
      });
    }).then(function () {
      renderAll();
      var lu = document.getElementById("lastUpdated");
      if (lu) lu.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    }).catch(function (err) {
      if (healthEl) healthEl.innerHTML = '<div style="text-align:center; color:'+C.soft+'; padding:34px 18px;">Couldn\u2019t load data: '+(err&&err.message?err.message:err)+'</div>';
    });
  }

  return {
    initialize: function (freshApi, state, cb) {
      // Signal ready FIRST so MyGeotab never hangs on a spinner, even if setup below hiccups.
      try { cb && cb(); } catch (e) {}
      try {
        api = freshApi;
        bodyEl = document.getElementById("body"); rootEl = document.getElementById("root");
        healthEl = document.getElementById("health"); oilEl = document.getElementById("oil");
        customEl = document.getElementById("custom");
        reportEl = document.getElementById("report");
        settingsEl = document.getElementById("settings");
        groupSelectEl = document.getElementById("groupSelect");
        toastEl = document.getElementById("toast");
        var rb = $("refreshBtn"); if (rb) rb.addEventListener("click", reloadAll);
        if (groupSelectEl) groupSelectEl.addEventListener("change", function () {
          selectedGroupId = groupSelectEl.value || null;
          renderAll();
        });
        var rangeSel = $("rangeSelect");
        if (rangeSel) rangeSel.addEventListener("change", function () {
          FAULT_LOOKBACK_DAYS = Number(rangeSel.value) || 7;
          reloadAll(); // re-pull faults for the new window
        });
        document.querySelectorAll("#tabs button").forEach(function (b) {
          b.addEventListener("click", function () { switchTab(b.getAttribute("data-tab")); });
        });
        applyTheme();
      } catch (e) { console.warn("init setup error:", e && e.message); }
    },
    focus: function (freshApi) { api = freshApi; try { applyTheme(); } catch(e){} reloadAll(); },
    blur: function () {}
  };
};
</script>
</body>
</html>
