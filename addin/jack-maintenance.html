      '<span id="oil-default-email" style="flex:1; min-width:180px; font-size:13px; color:'+C.ink+';">'+esc((globalSettings&&globalSettings.defaultEmailTo)||"(none set \u2014 using fleet address)")+'</span>' +
      '<button id="oil-edit-default" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Edit</button>' +
    '</div>';

    // Bulk "set for all shown vehicles" bar — interval + email.
    // "Shown" respects the top group picker, so with a group selected this IS that whole group.
    var selGroupName = selectedGroupId ? (groupNameMap()[selectedGroupId] || "this group") : null;
    var scopeNote = (oilFilter && oilFilter!=="all") ? "the filtered vehicles" : (selGroupName ? "all of "+selGroupName : "all tracked vehicles");
    summary += '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:9px 13px; margin-bottom:8px; box-shadow:'+C.shadow+';">' +
      '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
        '<span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+'; min-width:120px;">Set interval for all</span>' +
        '<input id="oil-bulk-interval" type="number" min="500" step="500" value="'+DEFAULT_INTERVAL_MILES+'" style="width:110px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"> ' +
        '<span style="font-size:13px; color:'+C.soft+';">'+UNITS+'</span>' +
        '<button id="oil-bulk-apply" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;">Apply to '+scopeNote+'</button>' +
      '</div>' +
      '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px; padding-top:12px; border-top:1px solid '+C.line+';">' +
        '<span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+'; min-width:120px;">Set email for all</span>' +
        '<input id="oil-bulk-email" type="text" placeholder="name@company.com, comma-separated" style="flex:1; min-width:200px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"> ' +
        '<button id="oil-bulk-email-apply" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;">Apply to '+scopeNote+'</button>' +
      '</div>' +
      '<div style="font-size:11.5px; color:'+C.faint+'; margin-top:8px;">Applies to '+scopeNote+' shown below. Leave the email blank and apply to clear per-vehicle recipients (those vehicles fall back to the default above).</div>' +
    '</div>';

    oilEl.innerHTML = summary + sectionLabel(
      "Oil across the fleet",
      counts.total + " tracked \u00b7 " + (counts.due||0) + " due now",
      resetModePill(globalSettings.autoResetOil !== false));
    if (counts.total===0) { oilEl.innerHTML += '<div style="text-align:center; color:'+C.soft+'; padding:26px 18px;">No vehicles with odometer data yet.</div>'; return; }

    var visible = (oilFilter && oilFilter!=="all") ? items.filter(function (it){ return it.status===oilFilter; }) : items;

    // attach group info + sort by group path so headers group naturally
    visible.forEach(function (it) { it.group = devicePrimaryGroup(it.device.id); });
    var hasAnyGroup = visible.some(function (it){ return it.group.id != null; });
    if (hasAnyGroup) {
      visible.sort(function (a,b) {
        var pa = a.group.path.join(" / "), pb = b.group.path.join(" / ");
        if (pa !== pb) return pa < pb ? -1 : 1;
        return a.device.name < b.device.name ? -1 : 1;
      });
    }

    // Build per-group buckets so each group header can carry an on/off toggle
    // for all of its (currently shown) vehicles.
    var oilGroupList = [];
    var groupIndexByPath = {};
    if (hasAnyGroup) {
      visible.forEach(function (it) {
        var p = it.group.path.join(" / ");
        if (!(p in groupIndexByPath)) {
          groupIndexByPath[p] = oilGroupList.length;
          oilGroupList.push({ name: it.group.path[it.group.path.length-1] || "Group", path: p, items: [] });
        }
        oilGroupList[groupIndexByPath[p]].items.push(it);
      });
    }

    var frag = document.createElement("div");
    var lastGroupPath = null;

    visible.forEach(function (it) {
      // emit a group header when the group path changes (only if we actually have groups)
      if (hasAnyGroup) {
        var pathStr = it.group.path.join(" / ");
        if (pathStr !== lastGroupPath) {
          lastGroupPath = pathStr;
          var header = document.createElement("div");
          header.style.cssText = "margin:18px 2px 8px; display:flex; align-items:center; gap:8px;";
          // render path with sub-group indentation feel: bold last segment, muted ancestors
          var crumb = it.group.path.map(function (seg, i) {
            var isLast = i === it.group.path.length-1;
            return '<span style="color:'+(isLast?C.ink:C.soft)+'; font-weight:'+(isLast?'700':'500')+';">'+esc(seg)+'</span>';
          }).join('<span style="color:'+C.faint+'; margin:0 6px;">\u203a</span>');
          var gIdx = groupIndexByPath[pathStr];
          var gInfo = oilGroupList[gIdx];
          var gEnabled = gInfo.items.filter(function (x){ return x.det.enabled!==false; }).length;
          var gTotal = gInfo.items.length;
          var gAllOn = gEnabled===gTotal, gNoneOn = gEnabled===0;
          var gCol = gAllOn?C.green:(gNoneOn?C.faint:C.amber);
          var gBg = gAllOn?C.greenBg:(gNoneOn?C.track:C.amberBg);
          var gLbl = gAllOn?"Auto reminders on":(gNoneOn?"Auto reminders off":"Auto reminders "+gEnabled+"/"+gTotal);
          header.innerHTML = '<span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:'+C.brand+';">Group</span>' +
            '<span style="font-size:13.5px;">'+crumb+'</span>' +
            '<span style="flex:1;"></span>' +
            '<button data-oilgroup="'+gIdx+'" title="Turn auto oil reminders on or off for every vehicle in this group" style="border:1px solid '+C.line+'; background:'+gBg+'; color:'+gCol+'; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;">' +
              '<span style="width:8px; height:8px; border-radius:50%; background:'+gCol+'; display:inline-block;"></span>'+gLbl+
            '</button>';
          frag.appendChild(header);
        }
      }
      var device=it.device, det=it.det, rec=it.rec, odoMeters=it.odoMeters, interval=it.interval, since=it.since, pct=it.pct, remaining=it.remaining;
      var pillHtml, fill;
      var predTxt = predictDueText(remaining, cache.rateMap[device.id]);
      if (it.status==="off"){ pillHtml=pill("Off",C.track,C.faint); fill=C.faint; }
      else if (it.status==="due"){ pillHtml=pill("Due now",C.redBg,C.red); fill=C.red; }
      else if (it.status==="soon"){ pillHtml=pill("Due soon \u00b7 "+fmt(remaining)+" "+UNITS+" left",C.amberBg,C.amber); fill=C.amber; }
      else { pillHtml=pill("On track \u00b7 "+fmt(remaining)+" "+UNITS+" left",C.greenBg,C.green); fill=C.green; }
      var sensors = sensorMap[device.id];
      var oilLifeBadge = "";
      if (sensors && sensors.oilLife != null) {
        var olc = sensors.oilLife < 15 ? C.red : (sensors.oilLife < 30 ? C.amber : C.green);
        oilLifeBadge = '<span style="font-size:12px; color:'+olc+'; font-weight:600; margin-right:12px;">Oil life '+Math.round(sensors.oilLife)+'%</span>';
      }
      var histHtml = "";
      var hist = (det.history || []).slice().sort(function (a,b){ return new Date(b.date)-new Date(a.date); });
      if (hist.length) {
        var histId = "hist-"+cssId(device.id);
        var isOpen = !!expandedHistory[device.id];
        var rowsHtml = hist.map(function (e) {
          var mi = e.odoMeters!=null ? fmt(e.odoMeters/METERS_PER_UNIT)+" "+UNITS : "—";
          var dt = e.date ? new Date(e.date).toLocaleDateString() : "";
          var isAuto = e.source==="auto";
          var srcBadge = isAuto
            ? '<span style="font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:'+C.amberBg+'; color:'+C.amber+'; margin-left:6px;">auto-triggered</span>'
            : '<span style="font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:'+C.greenBg+'; color:'+C.green+'; margin-left:6px;">manual</span>';
          var ol = (e.oilLife!=null) ? ' \u00b7 oil life was '+Math.round(e.oilLife)+'%' : '';
          var label = isAuto ? "auto-reset (service not confirmed)" : "marked serviced";
          return '<div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:'+C.soft+'; padding:5px 0; border-top:1px solid '+C.line+';">' +
            '<span>'+dt+' \u00b7 '+label+ol+srcBadge+'</span><span style="color:'+C.ink+'; font-weight:600;">'+mi+'</span></div>';
        }).join("");
        histHtml = '<div style="margin-top:11px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<div data-histtoggle="'+esc(device.id)+'" style="display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;">' +
            '<span style="font-size:13px; color:'+C.faint+'; width:12px;">'+(isOpen?"\u25be":"\u25b8")+'</span>' +
            '<span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+';">Service history</span>' +
            '<span style="font-size:11.5px; color:'+C.faint+';">('+hist.length+')</span>' +
          '</div>' +
          '<div id="'+histId+'" style="display:'+(isOpen?"block":"none")+'; margin-top:6px;">'+rowsHtml+'</div>' +
        '</div>';
      }

      var card = document.createElement("div");
      card.style.cssText = "background:"+C.card+"; border:1px solid "+C.line+"; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:"+C.shadow+";";
      var isCardOpen = !!expandedOil[device.id];
      card.innerHTML =
        '<div data-oiltoggle="'+esc(device.id)+'" style="display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;">' +
          '<span style="font-size:13px; color:'+C.faint+'; width:12px;">'+(isCardOpen?"\u25be":"\u25b8")+'</span>' +
          '<span style="font-size:16px; font-weight:650; color:'+C.ink+';">'+esc(device.name)+'</span>' +
          '<span style="flex:1;"></span>' +
          oilLifeBadge + pillHtml +
          '<span style="font-size:13px; color:'+C.soft+'; margin-left:12px;">'+fmt(odoMeters/METERS_PER_UNIT)+' '+UNITS+' total</span>' +
        '</div>' +
        '<div style="display:'+(isCardOpen?"block":"none")+'; margin-top:14px;">' +
          '<div><div style="height:8px; background:'+C.track+'; border-radius:999px; overflow:hidden;">' +
            '<div style="height:100%; width:'+pct+'%; border-radius:999px; background:'+fill+';"></div></div>' +
            '<div style="margin-top:7px; font-size:12px; color:'+C.soft+';">'+fmt(Math.max(0,since))+' / '+fmt(interval)+' '+UNITS+'</div>' +
            (predTxt && it.status!=="due" && it.status!=="off" ? '<div style="margin-top:6px; font-size:11.5px; color:'+C.soft+'; opacity:0.85;">\uD83D\uDCC5 Predicted: '+esc(predTxt)+' (based on last 30 days of mileage)</div>' : '') +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:11px; padding-top:10px; border-top:1px solid '+C.line+';">' +
            '<span style="font-size:13px; color:'+C.soft+';">Interval <input type="number" min="500" step="500" value="'+interval+'" style="width:92px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"> '+UNITS+'</span>' +
            '<label style="display:flex; align-items:center; gap:7px; font-size:13px; color:'+C.soft+'; cursor:pointer;"><input type="checkbox" '+(det.enabled!==false?"checked":"")+' style="width:15px; height:15px;"> Reminders on</label>' +
            '<button data-act="email" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Email\u2026</button>' +
            (det.emailTo
              ? '<span style="font-size:11.5px; color:'+C.soft+'; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="'+esc(det.emailTo)+'">\u2192 '+esc(det.emailTo)+'</span>'
              : '<span style="font-size:11.5px; color:'+C.faint+';">\u2192 using default</span>') +
            '<span style="flex:1;"></span>' +
            '<button data-act="reset" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;">Mark serviced now</button>' +
            '<button data-act="save" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;">Save</button>' +
          '</div>' +
          histHtml +
        '</div>';
      var intervalInput = card.querySelector('input[type="number"]');
      var enabledInput = card.querySelector('input[type="checkbox"]');
      card.querySelector('[data-act="save"]').addEventListener("click", function () {
        det.intervalMiles = Number(intervalInput.value)||DEFAULT_INTERVAL_MILES;
        det.enabled = enabledInput.checked; det.deviceName = device.name;
        persistOil(rec, det, device, oilMap).then(function () { toast("Saved "+device.name); reloadAll(); });
      });
      card.querySelector('[data-act="reset"]').addEventListener("click", function () {
        det.lastNotifiedMeters = odoMeters; det.lastNotifiedDate = new Date().toISOString(); det.deviceName = device.name;
        det.emailPending = true; det.emailPendingReason = "serviced"; det.emailPendingOdoMeters = odoMeters;
        if (!det.history) det.history = [];
        var ol = (sensors && sensors.oilLife != null) ? sensors.oilLife : null;
        det.history.push({ date: new Date().toISOString(), odoMeters: odoMeters, source: "manual", oilLife: ol });
        persistOil(rec, det, device, oilMap).then(function () { toast(device.name+" marked serviced — confirmation queued"); reloadAll(); });
      });
      card.querySelector('[data-act="email"]').addEventListener("click", function () {
        var current = det.emailTo || "";
        var input = window.prompt("Email recipients for "+device.name+" (comma-separated). Leave blank to use the fleet default:", current);
        if (input === null) return; // cancelled
        det.emailTo = input.trim() || null; det.deviceName = device.name;
        persistOil(rec, det, device, oilMap).then(function () {
          toast(det.emailTo ? "Recipients updated for "+device.name : "Reset to fleet default for "+device.name);
          renderOil(devices, odoMap, oilMap, sensorMap);
        });
      });
      frag.appendChild(card);
    });

    oilEl.appendChild(frag);

    // wire filter clicks
    document.querySelectorAll('[data-oilfilter]').forEach(function (el) {
      el.addEventListener("click", function () {
        var f = el.getAttribute("data-oilfilter");
        oilFilter = (oilFilter===f) ? null : f;
        renderOil(devices, odoMap, oilMap, sensorMap);
      });
    });
    var cof = document.getElementById("clearOilFilter");
    if (cof) cof.addEventListener("click", function () { oilFilter=null; renderOil(devices, odoMap, oilMap, sensorMap); });

    // wire bulk "set interval for all" — applies to the currently visible vehicles
    var bulkApply = document.getElementById("oil-bulk-apply");
    if (bulkApply) bulkApply.addEventListener("click", function () {
      var val = Number(document.getElementById("oil-bulk-interval").value) || 0;
      if (val < 500) { toast("Enter an interval of at least 500 "+UNITS); return; }
      var targets = visible; // respects any active filter
      if (!targets.length) { toast("No vehicles to update"); return; }
      if (!window.confirm("Set the oil change interval to "+fmt(val)+" "+UNITS+" for "+targets.length+" vehicle"+(targets.length===1?"":"s")+"?")) return;
      Promise.all(targets.map(function (it) {
        var det = it.rec ? it.rec.details : { deviceId:it.device.id, deviceName:it.device.name, lastNotifiedMeters:it.odoMeters, enabled:true, lastNotifiedDate:null, history:[] };
        det.intervalMiles = val; det.deviceName = it.device.name;
        return persistOil(it.rec, det, it.device, oilMap);
      })).then(function () {
        toast("Interval set to "+fmt(val)+" "+UNITS+" for "+targets.length+" vehicle"+(targets.length===1?"":"s"));
        reloadAll();
      });
    });

    // wire default recipients editor (shared fleet default — same record the Custom tab edits)
    var oilEditDefault = document.getElementById("oil-edit-default");
    if (oilEditDefault) oilEditDefault.addEventListener("click", function () {
      var current = (globalSettings && globalSettings.defaultEmailTo) || "";
      var input = window.prompt("Default email recipients for the whole fleet (comma-separated). Individual vehicles can override this:", current);
      if (input === null) return;
      var det = { defaultEmailTo: input.trim() || null };
      patchSettings(det).then(function () { toast("Default recipients saved"); renderOil(devices, odoMap, oilMap, sensorMap); });
    });

    // wire bulk "set email for all" — applies to the currently visible vehicles (respects the group picker)
    var bulkEmail = document.getElementById("oil-bulk-email-apply");
    if (bulkEmail) bulkEmail.addEventListener("click", function () {
      var val = (document.getElementById("oil-bulk-email").value || "").trim();
      var targets = visible; // same filtered set the interval bulk uses
      if (!targets.length) { toast("No vehicles to update"); return; }
      var msg = val
        ? "Set the email recipients to \""+val+"\" for "+targets.length+" vehicle"+(targets.length===1?"":"s")+"?"
        : "Clear per-vehicle recipients (fall back to the fleet default) for "+targets.length+" vehicle"+(targets.length===1?"":"s")+"?";
      if (!window.confirm(msg)) return;
      Promise.all(targets.map(function (it) {
        var det = it.det; // already the record's details or a fresh default (with emailTo)
        det.emailTo = val || null; det.deviceName = it.device.name;
        return persistOil(it.rec, det, it.device, oilMap);
      })).then(function () {
        toast((val?"Recipients set":"Recipients cleared")+" for "+targets.length+" vehicle"+(targets.length===1?"":"s"));
        reloadAll();
      });
    });

    // wire service-history collapse toggles
    oilEl.querySelectorAll('[data-histtoggle]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-histtoggle");
        expandedHistory[id] = !expandedHistory[id];
        renderOil(devices, odoMap, oilMap, sensorMap);
      });
    });

    // wire per-group auto-reminder on/off toggles
    oilEl.querySelectorAll('[data-oilgroup]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var gInfo = oilGroupList[Number(btn.getAttribute("data-oilgroup"))];
        if (!gInfo || !gInfo.items.length) return;
        var allOn = gInfo.items.every(function (x){ return x.det.enabled!==false; });
        var target = !allOn; // everyone on -> turn off; otherwise turn everyone on
        if (!window.confirm((target?"Turn auto oil reminders ON":"Turn auto oil reminders OFF")+" for all "+gInfo.items.length+" vehicle"+(gInfo.items.length===1?"":"s")+" in "+gInfo.name+"?")) return;
        Promise.all(gInfo.items.map(function (it) {
          var det = it.det; det.enabled = target; det.deviceName = it.device.name;
          return persistOil(it.rec, det, it.device, oilMap);
        })).then(function () {
          toast((target?"Auto reminders on":"Auto reminders off")+" \u00b7 "+gInfo.name+" ("+gInfo.items.length+")");
          reloadAll();
        });
      });
    });

    // wire per-asset collapse toggles (cards start collapsed, like Fleet Health)
    oilEl.querySelectorAll('[data-oiltoggle]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-oiltoggle");
        expandedOil[id] = !expandedOil[id];
        renderOil(devices, odoMap, oilMap, sensorMap);
      });
    });
  }
  function oilSumCard(num, label, fg, filterKey) {
    var active = oilFilter===filterKey;
    var border = "1px solid " + (active ? fg+"66" : C.line);
    var shadow = active ? "inset 0 0 0 1px "+fg+"55, "+C.shadow : C.shadow;
    return '<div data-oilfilter="'+filterKey+'" style="background:'+C.card+'; border:'+border+'; border-radius:10px; padding:10px 13px; flex:1; min-width:120px; box-shadow:'+shadow+'; cursor:pointer;">' +
      '<div style="font-size:24px; font-weight:700; letter-spacing:-0.025em; line-height:1.1; color:'+fg+';">'+num+'</div>' +
      '<div style="font-size:11.5px; color:'+C.soft+'; margin-top:2px;">'+label+' \u203a</div></div>';
  }
  function persistOil(rec, det, device, oilMap) {
    var entity = { addInId:ADD_IN_ID, groups:[{id:"GroupCompanyId"}], details:det };
    var method = rec&&rec.id?"Set":"Add"; if (rec&&rec.id) entity.id = rec.id;
    return apiCall(method, { typeName:"AddInData", entity:entity }).then(function (newId) {
      if (!rec) rec = { id:newId, details:det }; else rec.details = det; oilMap[device.id] = rec;
    });
  }

  // ---- CUSTOM REMINDERS tab ------------------------------------------
  function persistCustom(rec) {
    var entity = { addInId:CUSTOM_ADD_IN_ID, groups:[{id:"GroupCompanyId"}], details:rec.details };
    var method = rec.id ? "Set" : "Add"; if (rec.id) entity.id = rec.id;
    return apiCall(method, { typeName:"AddInData", entity:entity }).then(function (newId) {
      if (!rec.id) rec.id = newId; return rec;
    });
  }
  function deleteCustom(rec) {
    if (!rec.id) return Promise.resolve();
    return apiCall("Remove", { typeName:"AddInData", entity:{ id:rec.id, addInId:CUSTOM_ADD_IN_ID } });
  }

  function renderCustom(devices, odoMap, customList) {
    if (!customEl) return;
    customList = customList || [];
    var odoByDevice = odoMap || {};
    var nameById = {}; devices.forEach(function (d){ nameById[d.id] = d.name; });

    // How many reminders each asset already has, and which names are taken.
    // Multiple reminders per asset are allowed (up to MAX_CUSTOM_PER_ASSET);
    // duplicate names on the same asset are not, so a group re-add is safe to repeat.
    var countByDevice = {}, labelsByDevice = {};
    customList.forEach(function (r) {
      var dd = r.details; if (!dd || !dd.deviceId) return;
      countByDevice[dd.deviceId] = (countByDevice[dd.deviceId] || 0) + 1;
      if (!labelsByDevice[dd.deviceId]) labelsByDevice[dd.deviceId] = {};
      labelsByDevice[dd.deviceId][String(dd.label || "Reminder").trim().toLowerCase()] = true;
    });
    function slotsLeft(deviceId) { return MAX_CUSTOM_PER_ASSET - (countByDevice[deviceId] || 0); }
    function hasLabel(deviceId, label) {
      var m = labelsByDevice[deviceId]; if (!m) return false;
      return !!m[String(label || "Reminder").trim().toLowerCase()];
    }

    // ---- add form ----
    var deviceOpts = devices.map(function (d) {
      return '<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>';
    }).join("");
    // real operational groups only (exclude Geotab classification clutter)
    var names = groupNameMap();
    var groupOpts = allGroups.filter(function (g) {
      return names[g.id] && !isExcludedGroupName(names[g.id]);
    }).map(function (g) {
      // count vehicles in this group + descendants
      var allowed = groupWithDescendants(g.id);
      var count = devices.filter(function (dev){ return (deviceGroups[dev.id]||[]).some(function (gid){ return allowed[gid]; }); }).length;
      return '<option value="'+esc(g.id)+'">'+esc(names[g.id])+' ('+count+' vehicle'+(count===1?'':'s')+')</option>';
    }).join("");

    var form =
      '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:'+C.shadow+';">' +
        '<div style="font-size:14px; font-weight:650; color:'+C.ink+'; margin-bottom:12px;">Add a custom reminder</div>' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">' +
          '<label style="font-size:12px; color:'+C.soft+';">Apply to<br><select id="cr-mode" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"><option value="asset">A single asset</option><option value="group">A whole group</option></select></label>' +
          '<label id="cr-asset-wrap" style="font-size:12px; color:'+C.soft+';">Asset<br><select id="cr-device" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:170px;">'+deviceOpts+'</select></label>' +
          '<label id="cr-group-wrap" style="display:none; font-size:12px; color:'+C.soft+';">Group<br><select id="cr-group" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:200px;">'+(groupOpts||'<option value="">No groups found</option>')+'</select></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Reminder name<br><input id="cr-label" type="text" placeholder="e.g. Brake inspection" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:170px;"></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Type<br><select id="cr-type" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"><option value="mi">Every X miles</option><option value="days">Every X days</option></select></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Interval<br><input id="cr-interval" type="number" min="1" value="5000" style="margin-top:4px; width:100px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Email to<br><input id="cr-email" type="text" placeholder="optional" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:150px;"></label>' +
          '<button id="cr-add" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Add reminder</button>' +
        '</div>' +
        '<div id="cr-asset-note" style="font-size:11.5px; color:'+C.soft+'; margin-top:10px;"></div>' +
        '<div id="cr-mode-note" style="font-size:11.5px; color:'+C.soft+'; margin-top:6px; display:none;">A separate reminder will be created for each vehicle in the group, each tracking its own mileage. Up to '+MAX_CUSTOM_PER_ASSET+' custom reminders per asset — vehicles already at the limit, or that already have a reminder with this name, are skipped.</div>' +
      '</div>';

    // ---- existing reminders ----
    // Build a single reminder card's inner HTML (used standalone and inside batches)
    // insideBatch = compact child card in a group batch (titled by vehicle).
    // hideAsset  = card sits under a per-asset header, so the vehicle name is
    //              already shown above and only the interval is repeated.
    function reminderCard(rec, insideBatch, hideAsset) {
      var d = rec.details;
      var unit = d.type === "days" ? "days" : UNITS;
      var progress, remaining, pct;
      if (d.type === "days") {
        var start = d.baselineDate ? new Date(d.baselineDate).getTime() : Date.now();
        var elapsed = (Date.now() - start) / 86400000;
        progress = elapsed; remaining = d.interval - elapsed;
        pct = Math.max(0, Math.min(100, (elapsed / d.interval) * 100));
      } else {
        var odo = odoByDevice[d.deviceId];
        var since = odo!=null && d.baselineMeters!=null ? (odo - d.baselineMeters)/METERS_PER_UNIT : 0;
        progress = since; remaining = d.interval - since;
        pct = Math.max(0, Math.min(100, (since / d.interval) * 100));
      }
      var pillHtml, fill;
      if (d.enabled===false){ pillHtml=pill("Off",C.track,C.faint); fill=C.faint; }
      else if (remaining<=0){ pillHtml=pill("Due now",C.redBg,C.red); fill=C.red; }
      else if (pct>=85){ pillHtml=pill("Due soon",C.amberBg,C.amber); fill=C.amber; }
      else { pillHtml=pill(fmt(Math.max(0,remaining))+" "+unit+" left",C.greenBg,C.green); fill=C.green; }

      var histHtml = "";
      var hist = (d.history||[]).slice().sort(function (a,b){ return new Date(b.date)-new Date(a.date); });
      if (hist.length) {
        histHtml = '<div style="margin-top:10px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+'; margin-bottom:5px;">History</div>' +
          hist.map(function (e){
            var val = d.type==="days" ? (e.date?new Date(e.date).toLocaleDateString():"") : (e.odoMeters!=null?fmt(e.odoMeters/METERS_PER_UNIT)+" "+UNITS:"—");
            var dt = e.date ? new Date(e.date).toLocaleDateString() : "";
            var isAuto = e.source==="auto";
            var badge = isAuto
              ? '<span style="font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:'+C.amberBg+'; color:'+C.amber+'; margin-left:6px;">auto</span>'
              : '<span style="font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:'+C.greenBg+'; color:'+C.green+'; margin-left:6px;">done</span>';
            return '<div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:'+C.soft+'; padding:3px 0;"><span>'+dt+' \u00b7 '+esc(d.label||"Reminder")+badge+'</span><span style="color:'+C.ink+';">'+val+'</span></div>';
          }).join("") + '</div>';
      }
      var margin = insideBatch ? "margin:8px 0 0;" : "margin-bottom:8px;";
      var titleLine;
      if (insideBatch) {
        titleLine = '<div><span style="font-size:14px; font-weight:600; color:'+C.ink+';">'+esc(d.deviceName||nameById[d.deviceId]||"")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">every '+fmt(d.interval)+' '+unit+'</div></div>';
      } else if (hideAsset) {
        // vehicle name already shown in the section header above this card
        titleLine = '<div><span style="font-size:14.5px; font-weight:650; color:'+C.ink+';">'+esc(d.label||"Reminder")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">every '+fmt(d.interval)+' '+unit+'</div></div>';
      } else {
        titleLine = '<div><span style="font-size:15px; font-weight:650; color:'+C.ink+';">'+esc(d.label||"Reminder")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">'+esc(d.deviceName||nameById[d.deviceId]||"")+' \u00b7 every '+fmt(d.interval)+' '+unit+'</div></div>';
      }

      return '<div data-crid="'+esc(rec.id)+'" style="background:'+(insideBatch?C.card2:C.card)+'; border:1px solid '+C.line+'; border-radius:12px; padding:11px 13px; '+margin+' '+(insideBatch?'':'box-shadow:'+C.shadow+';')+'">' +
        '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px;">' +
          titleLine + pillHtml +
        '</div>' +
        '<div style="height:8px; background:'+C.track+'; border-radius:999px; overflow:hidden;"><div style="height:100%; width:'+pct+'%; border-radius:999px; background:'+fill+';"></div></div>' +
        '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:11px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<label style="display:flex; align-items:center; gap:7px; font-size:13px; color:'+C.soft+'; cursor:pointer;"><input type="checkbox" data-cr="enabled" '+(d.enabled!==false?"checked":"")+' style="width:15px; height:15px;"> On</label>' +
          '<button data-cr="edit-email" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Email\u2026</button>' +
          '<span style="flex:1;"></span>' +
          '<button data-cr="complete" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Mark done</button>' +
          '<button data-cr="delete" style="border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Delete</button>' +
        '</div>' +
        histHtml +
      '</div>';
    }

    var listHtml = "";
    if (!customList.length) {
      listHtml = '<div style="text-align:center; color:'+C.soft+'; padding:22px 18px;">No custom reminders yet. Add one above.</div>';
    } else {
      // separate batch reminders from standalone ones
      var batches = {}, standalone = [];
      customList.forEach(function (rec) {
        var b = rec.details.batchId;
        if (b) { if (!batches[b]) batches[b]=[]; batches[b].push(rec); }
        else standalone.push(rec);
      });

      // render each batch as a collapsible line
      Object.keys(batches).forEach(function (bId) {
        var recs = batches[bId];
        var d0 = recs[0].details;
        var unit = d0.type === "days" ? "days" : UNITS;
        var isOpen = !!expandedBatch[bId];
        // batch summary status: worst of the group
        var anyDue=false, anySoon=false, onCount=0;
        recs.forEach(function (r){
          var dd=r.details; if (dd.enabled!==false) onCount++;
          var rem;
          if (dd.type==="days"){ var st=dd.baselineDate?new Date(dd.baselineDate).getTime():Date.now(); rem=dd.interval-((Date.now()-st)/86400000); }
          else { var o=odoByDevice[dd.deviceId]; var s=o!=null&&dd.baselineMeters!=null?(o-dd.baselineMeters)/METERS_PER_UNIT:0; rem=dd.interval-s; }
          if (dd.enabled!==false){ if (rem<=0) anyDue=true; else if (rem<=dd.interval*0.15) anySoon=true; }
        });
        var bPill = anyDue?pill(recs.length+" vehicles \u00b7 some due",C.redBg,C.red)
                  : anySoon?pill(recs.length+" vehicles \u00b7 due soon",C.amberBg,C.amber)
                  : pill(recs.length+" vehicles \u00b7 on track",C.greenBg,C.green);

        var inner = "";
        if (isOpen) {
          inner = '<div style="margin-top:10px; padding-top:10px; border-top:1px solid '+C.line+';">' +
            '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">' +
              '<span style="font-size:12px; color:'+C.soft+';">Set interval for all:</span>' +
              '<input data-batchinterval="'+esc(bId)+'" type="number" min="1" value="'+d0.interval+'" style="width:100px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card+'; color:'+C.ink+';"> '+unit +
              '<button data-batchsave="'+esc(bId)+'" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Apply to all '+recs.length+'</button>' +
              '<button data-batchdelete="'+esc(bId)+'" style="border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Delete all</button>' +
            '</div>' +
            recs.map(function (r){ return reminderCard(r, true); }).join("") +
          '</div>';
        }

        listHtml += '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:'+C.shadow+';">' +
          '<div data-batchtoggle="'+esc(bId)+'" style="display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none;">' +
            '<span style="font-size:14px; color:'+C.faint+'; width:12px;">'+(isOpen?"\u25be":"\u25b8")+'</span>' +
            '<div style="flex:1;"><span style="font-size:15px; font-weight:650; color:'+C.ink+';">'+esc(d0.label||"Reminder")+'</span>' +
            '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">'+esc(d0.batchGroupName||"Group")+' \u00b7 '+recs.length+' vehicles \u00b7 every '+fmt(d0.interval)+' '+unit+'</div></div>' +
            bPill +
          '</div>' + inner +
        '</div>';
      });

      // standalone reminders as normal cards — cluster by asset so a vehicle's
      // multiple reminders sit together, then alphabetical by reminder name
      standalone.sort(function (a, b) {
        var an = (a.details.deviceName || nameById[a.details.deviceId] || "").toLowerCase();
        var bn = (b.details.deviceName || nameById[b.details.deviceId] || "").toLowerCase();
        if (an !== bn) return an < bn ? -1 : 1;
        var al = String(a.details.label || "").toLowerCase(), bl = String(b.details.label || "").toLowerCase();
        return al < bl ? -1 : al > bl ? 1 : 0;
      });
      // With up to MAX_CUSTOM_PER_ASSET reminders per vehicle, repeat the asset
      // name once as a header instead of on every card.
      var lastDevice = null;
      standalone.forEach(function (rec) {
        var did = rec.details.deviceId;
        if (did !== lastDevice) {
          lastDevice = did;
          var used = countByDevice[did] || 0;
          listHtml +=
            '<div style="display:flex; align-items:center; gap:9px; margin:14px 3px 7px;">' +
              '<span style="font-size:12.5px; font-weight:700; letter-spacing:.01em; color:'+C.ink+';">'+esc(rec.details.deviceName || nameById[did] || "Unknown asset")+'</span>' +
              '<span style="flex:1; height:1px; background:linear-gradient(90deg,'+C.line+',rgba(0,0,0,0));"></span>' +
              '<span style="font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:'+(used>=MAX_CUSTOM_PER_ASSET?C.amber:C.faint)+';">'+used+' / '+MAX_CUSTOM_PER_ASSET+'</span>' +
            '</div>';
        }
        listHtml += reminderCard(rec, false, true);
      });
    }

    var settingsBar =
      '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:9px 13px; margin-bottom:8px; box-shadow:'+C.shadow+'; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
        '<span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+';">Default email recipients</span>' +

    // wire batch toggles + batch edit/delete

  }
  // Walk the Geotab group tree root-to-leaf, handing back depth so callers can
  // render the real hierarchy instead of a flat list. Excluded classification
  // branches are pruned along with their descendants.
  function walkGroupTree(cb) {
    var isChild = {};
    Object.keys(groupChildren).forEach(function (p){ groupChildren[p].forEach(function (c){ isChild[c] = true; }); });
    var names = groupNameMap();
    var seen = {};
    function walk(id, depth) {
      if (seen[id]) return; seen[id] = true;
      var nm = names[id];
      if (isExcludedGroupName(nm)) return; // prune the whole branch
      var kids = (groupChildren[id] || []).slice();
      if (nm && nm !== id) { cb(id, nm, depth); depth = depth + 1; }
      kids.sort(function (a, b){ return String(names[a]||"").localeCompare(String(names[b]||"")); });
      kids.forEach(function (c){ walk(c, depth); });
    }
    var roots = allGroups.filter(function (g){ return !isChild[g.id]; });
    roots.sort(function (a, b){ return String(names[a.id]||"").localeCompare(String(names[b.id]||"")); });
    roots.forEach(function (g){ walk(g.id, 0); });
  }

  // Devices belonging to a group or any of its descendants.
  function devicesInGroup(allDevices, groupId) {
    var allowed = groupWithDescendants(groupId);
    return allDevices.filter(function (d){ return (deviceGroups[d.id]||[]).some(function (gid){ return allowed[gid]; }); });
  }

  function cssIdSel(s) { return String(s).replace(/["\\]/g,"\\$&"); }

  // ---- REPORTING tab ---------------------------------------------------
  // Mirrors the row logic in check-oil-reminders.js so the CSV you download
  // here matches the spreadsheet that gets emailed on schedule.
  // Most recent completed service from a reminder's history, preferring manual
  // confirmations over auto-resets. Mirrors lastServiceFrom() in the script.
  function lastServiceFrom(det) {
    var hist = (det && det.history) || [];
    if (!hist.length) return { date:null, odoMeters:null, source:null };
    var sorted = hist.slice().sort(function (a,b){ return new Date(b.date) - new Date(a.date); });
    var manual = null;
    for (var i=0;i<sorted.length;i++) { if (sorted[i].source === "manual") { manual = sorted[i]; break; } }
    var pick = manual || sorted[0];
    return { date: pick.date || null, odoMeters: pick.odoMeters != null ? pick.odoMeters : null, source: pick.source || null };
  }
  function fmtServiceDate(iso) {
    if (!iso) return "\u2014";
    var d = new Date(iso);
    if (isNaN(d)) return "\u2014";
    return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
  }

  function buildReportRows(devices) {
    var customByDevice = {};
    (cache.customList || []).forEach(function (r) {
      var d = r.details;
      if (!d || !d.deviceId || d.settingsKey === "global" || d.enabled === false) return;
      var due = false, soon = false;
      if (d.type === "days") {
        var st = d.baselineDate ? new Date(d.baselineDate).getTime() : Date.now();
        var elapsed = (Date.now() - st) / 86400000;
        if (elapsed >= d.interval) due = true;
        else if ((d.interval - elapsed) <= caution().dateDays) soon = true;
      } else {
        var o = cache.odoMap[d.deviceId];
        if (o != null && d.baselineMeters != null) {
          var since = (o - d.baselineMeters)/METERS_PER_UNIT;
          if (since >= d.interval) due = true;
          else if ((d.interval - since) <= soonWindow(d.interval)) soon = true;
        }
      }
      if (!customByDevice[d.deviceId]) customByDevice[d.deviceId] = { due:0, soon:0 };
      if (due) customByDevice[d.deviceId].due++;
      else if (soon) customByDevice[d.deviceId].soon++;
    });

    return devices.map(function (device) {
      var odoMeters = cache.odoMap[device.id];
      var rec = cache.oilMap[device.id];
      var det = rec && rec.details;
      var status, remaining = null;

      if (odoMeters == null) {
        status = "No odometer data";
      } else if (!det) {
        status = "On track";
        remaining = DEFAULT_INTERVAL_MILES;
      } else if (det.enabled === false) {
        status = "Reminders off";
      } else {
        var interval = det.intervalMiles || DEFAULT_INTERVAL_MILES;
        var since = (odoMeters - det.lastNotifiedMeters)/METERS_PER_UNIT;
        remaining = interval - since;
        if (remaining <= 0) status = (globalSettings.autoResetOil === false) ? "Overdue \u2014 awaiting confirmation" : "Due now";
        else if (remaining <= soonWindow(interval)) status = "Due soon";
        else status = "On track";
      }

      var c = customByDevice[device.id];
      if (c) {
        var extras = [];
        if (c.due) extras.push(c.due+" custom due");
        if (c.soon) extras.push(c.soon+" custom due soon");
        if (extras.length) {
          if (status === "On track" && c.due) status = "Due now ("+extras.join(", ")+")";
          else status = status+" ("+extras.join(", ")+")";
        }
      }

      var last = lastServiceFrom(det);
      return {
        deviceId: device.id,
        name: device.name,
        status: status,
        remaining: remaining == null ? null : Math.round(remaining),
        odo: odoMeters == null ? null : Math.round(odoMeters/METERS_PER_UNIT),
        lastDate: last.date,
        lastOdo: last.odoMeters == null ? null : Math.round(last.odoMeters/METERS_PER_UNIT)
      };
    }).sort(function (a,b){ return String(a.name).localeCompare(String(b.name), undefined, {numeric:true}); });
  }

  // Which assets the report covers, per the current draft selection.
  function selectedReportDevices(allDevices, r) {
    if (!r || r.assetMode === "all") return allDevices;
    if (r.assetMode === "assets") {
      var want = {}; (r.deviceIds||[]).forEach(function (id){ want[id]=true; });
      return allDevices.filter(function (d){ return want[d.id]; });
    }
    if (r.assetMode === "groups") {
      // Selecting a parent group must include everything beneath it, so expand
      // each chosen group to its full descendant set before matching.
      var wantG = {};
      (r.groupIds||[]).forEach(function (id) {
        var tree = groupWithDescendants(id);
        Object.keys(tree).forEach(function (gid){ wantG[gid] = true; });
      });
      return allDevices.filter(function (d){ return (deviceGroups[d.id]||[]).some(function (gid){ return wantG[gid]; }); });
    }
    return allDevices;
  }

  function panel(title, note, inner) {

    // ---- asset selection panel ----

    // Every mode gets an explicit "add these to the list" action on the right,

    var addBtnCss = 'border:1px solid '+C.brand+'59; background:'+C.brandSoft+'; color:'+C.brand+'; border-radius:7px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:pointer;';
