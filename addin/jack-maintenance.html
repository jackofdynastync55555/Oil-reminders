<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DynastyJack Maintenance</title>
<style>
  /* Space Grotesk per the brand system. @import must be the first rule in the
     sheet or the browser discards it; loadBrandFont() below also injects a
     <link> at runtime in case MyGeotab strips head elements. */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap');

  /* ---- Shell --------------------------------------------------------
     Flat, product-style dark surface. Panels read as quiet cards with a
     hairline border rather than glowing objects. */
  html, body { background:#0a0d13; }
  body {
    background: #0a0d13 !important;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(34,211,238,.26); }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background:#222c3a; border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:#313f52; background-clip:padding-box; }

  /* Panels: hairline rim + a soft drop for depth. No coloured bloom. */
  #root div[style*="border-radius:12px"] {
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9) !important;
    transition: border-color .15s ease;
  }
  #root div[style*="border-radius:12px"]:hover { border-color:#2c3a4c !important; }

  /* ---- Controls ----------------------------------------------------- */
  #root input, #root select, #root button, #root textarea { font-family: inherit; outline: none; }
  #root input:focus, #root select:focus {
    border-color: rgba(34,211,238,.6) !important;
    box-shadow: 0 0 0 3px rgba(34,211,238,.15) !important;
  }
  #root button { transition: background-color .14s ease, border-color .14s ease, color .14s ease; }
  #root button:hover { filter: brightness(1.12); }
  #root button:active { transform: translateY(1px); }
  #root select { appearance: none; -webkit-appearance: none; padding-right: 26px !important;
    background-image: linear-gradient(45deg, transparent 50%, #8f9dad 50%), linear-gradient(135deg, #8f9dad 50%, transparent 50%);
    background-position: calc(100% - 15px) calc(50% + 1px), calc(100% - 10px) calc(50% + 1px);
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  #root input[type="checkbox"] { accent-color:#22D3EE; }

  /* ---- Brand wordmark -------------------------------------------------
     Space Grotesk per the brand system (display & wordmarks, 500/600/700).
     Falls back to a neutral geometric stack if the webfont is blocked. */
  #root, #root input, #root select, #root button, #root textarea {
    font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  #brandMark { display:flex; align-items:center; gap:15px; padding:2px 6px 2px 2px; }
  #brandLock { display:flex; flex-direction:column; gap:1px; min-width:0; }
  #wordmark {
    font-family: 'Space Grotesk', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size:21px; font-weight:700; letter-spacing:-0.018em; line-height:1.05; white-space:nowrap;
  }
  /* "dynasty" in white, "fleet" in the primary gradient, terminal dot in Fleet cyan */
  #wordmark .wm-a { color:#FFFFFF; }
  #wordmark .wm-b {
    background: linear-gradient(96deg, #FF3B30 0%, #F7A23A 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color:#F7A23A;
  }
  #wordmark .wm-dot { color:#22D3EE; }
  #brandSub { font-size:11.5px; color:#616f80; letter-spacing:.01em; }
</style>
</head>
<body id="body" style="margin:0; min-height:100vh; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; line-height:1.4;">
<div id="root" style="max-width:1180px; margin:0 auto; padding:16px 20px 44px;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
    <div id="brandMark">
      <!-- "The orbital d" — geometry taken verbatim from the Dynasty brand
           files (00_brand_sheet.pdf). Do not recolor, stretch or rebuild. -->
      <svg width="34" height="40" viewBox="0 0 118.1 137.79" aria-label="Dynasty" role="img" style="flex:none; overflow:visible;">
        <defs>
          <linearGradient id="djGrad" gradientUnits="userSpaceOnUse"
            x1="19.941043" y1="29.228327" x2="77.508291" y2="106.7227"
            gradientTransform="matrix(1.711538,0,0,1.711538,38.807692,146.211538)">
            <stop offset="0" stop-color="#FF3B30"/>
            <stop offset="1" stop-color="#F7A23A"/>
          </linearGradient>
        </defs>
        <g transform="translate(-58.49,-187.29)">
          <circle cx="117.539062" cy="266.019531" r="51.3438" fill="none" stroke="url(#djGrad)" stroke-width="15.403846"/>
          <path fill="url(#djGrad)" d="M 168.882812 187.289062 C 173.136719 187.289062 176.585938 191.542969 176.585938 194.992188 L 176.585938 309.664062 C 176.585938 313.917969 173.136719 317.367188 168.882812 317.367188 C 164.628906 317.367188 161.179688 313.113281 161.179688 309.664062 L 161.179688 194.992188 C 161.179688 190.738281 164.628906 187.289062 168.882812 187.289062 Z"/>
          <path fill="none" stroke="#7C5CFF" stroke-width="9.177802" stroke-linecap="round" stroke-dasharray="111.444735 36.711207" transform="matrix(1,0.8391,-0.8391,1,0,0)" d="M 223.561437 98.229911 C 223.563905 111.262996 212.99651 121.829316 199.963425 121.831784 C 186.930708 121.830036 176.362096 111.264565 176.361921 98.229556 C 176.363668 85.19684 186.92914 74.628228 199.961856 74.629975 C 212.996865 74.6298 223.563185 85.197194 223.561437 98.229911 Z"/>
          <circle cx="117.539062" cy="266.019531" r="10.2695" fill="#22D3EE"/>
        </g>
      </svg>
      <div id="brandLock">
        <div id="wordmark"><span class="wm-a">dynasty</span> <span class="wm-b">fleet</span><span class="wm-dot">.</span></div>
        <div id="brandSub">Maintenance &middot; DynastyJack</div>
      </div>
    </div>
    <div style="display:flex; gap:7px; align-items:center; flex-wrap:wrap;">
      <span id="lastUpdated" style="font-size:11px; letter-spacing:.02em; margin-right:3px;"></span>
      <select id="rangeSelect" style="border-radius:8px; padding:7px 10px; font-size:12.5px; cursor:pointer;" title="Fault lookback window">
        <option value="1">Last 24 hours</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last month</option>
      </select>
      <select id="groupSelect" style="border-radius:8px; padding:7px 10px; font-size:12.5px; cursor:pointer; max-width:230px;"></select>
      <button id="refreshBtn" title="Reload fleet data" style="border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:650; cursor:pointer;">&#8635; Refresh</button>
    </div>
  </div>

  <div id="appBanner" style="display:flex; align-items:center; gap:12px; border-radius:10px; padding:11px 14px; margin-bottom:14px;">
    <span id="appBannerBar" style="width:3px; align-self:stretch; border-radius:2px; flex:none;"></span>
    <div id="appBannerText" style="font-size:12.5px; line-height:1.5;"></div>
  </div>

  <div id="appEyebrow" style="display:none;"></div>
  <div id="appTitle" style="display:none;"></div>
  <div id="appSub" style="display:none;"></div>

  <div id="tabs" style="display:flex; gap:2px; margin-bottom:16px; flex-wrap:wrap;">
    <button data-tab="health" style="background:none; border:none; font-weight:650; font-size:13.5px; padding:9px 14px; cursor:pointer;">Fleet Health<span data-count="health"></span></button>
    <button data-tab="oil" style="background:none; border:none; font-weight:650; font-size:13.5px; padding:9px 14px; cursor:pointer;">Oil<span data-count="oil"></span></button>
    <button data-tab="custom" style="background:none; border:none; font-weight:650; font-size:13.5px; padding:9px 14px; cursor:pointer;">Service<span data-count="custom"></span></button>
    <button data-tab="report" style="background:none; border:none; font-weight:650; font-size:13.5px; padding:9px 14px; cursor:pointer;">Reporting</button>
    <button data-tab="settings" style="background:none; border:none; font-weight:650; font-size:13.5px; padding:9px 14px; cursor:pointer;">Setup</button>
  </div>

  <div id="health"></div>
  <div id="oil" style="display:none;"></div>
  <div id="custom" style="display:none;"></div>
  <div id="report" style="display:none;"></div>
  <div id="settings" style="display:none;"></div>
</div>
<div id="toast" style="position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(10px); padding:10px 20px; border-radius:10px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; z-index:99;"></div>

<script>
"use strict";

var ADD_IN_ID = "aWI4NTRlNjItNzc5Ny0wOTB";
var CUSTOM_ADD_IN_ID = "ajE5ODViNGYtOTJmZC0wODk"; // separate store for custom reminders
var DEFAULT_INTERVAL_MILES = 5000;
var MAX_CUSTOM_PER_ASSET = 5; // how many custom reminders one vehicle may have
var UNITS = "mi";
var METERS_PER_UNIT = UNITS === "km" ? 1000 : 1609.344;
var FAULT_LOOKBACK_DAYS = 7; // controlled by the range selector (24h / 7d / 30d)

// ---- Theme ------------------------------------------------------------
// Flat product-dark: near-black surface, hairline borders, cyan primary with
// a violet secondary for state badges. No coloured glow on panels.
var THEMES = {
  dark: {
    // Dynasty Brand System v1.0 — Cyan #22D3EE (Fleet), Violet #7C5CFF (Works),
    // Orange #F39830, Ink #15181F, primary gradient #FF3B30 -> #F7A23A.
    page:"#0a0d13", card:"#121720", card2:"#182030", ink:"#f2f5f8", soft:"#8f9dad",
    faint:"#616f80", line:"#222c3a", brand:"#22D3EE", brandSoft:"#08303a", onBrand:"#04141d", track:"#1a2230",
    green:"#34d399", greenBg:"#082a22", amber:"#F39830", amberBg:"#2b1d08", lowamber:"#f0b866", lowamberBg:"#241a06",
    red:"#FF3B30", redBg:"#2c1315", device:"#7C5CFF", deviceBg:"#1a1533", purple:"#7C5CFF", purpleBg:"#1a1533",
    gradFrom:"#FF3B30", gradTo:"#F7A23A", brandOrange:"#F39830", brandInk:"#15181F",
    shadow:"0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9)"
  }
};
var C = THEMES.dark;

geotab.addin.jackMaintenance = function () {
  var api, toastEl, healthEl, oilEl, customEl, reportEl, settingsEl, bodyEl, rootEl, groupSelectEl;
  var allGroups = [];        // raw group list
  var groupChildren = {};    // parentId -> [childId,...]
  var selectedGroupId = null; // null = whole fleet
  var deviceGroups = {};     // deviceId -> [groupId,...]
  var expandedAsset = null; // device id whose detail panel is open
  var healthFilter = null;  // null | 'red' | 'amber' | 'green' — summary card filter
  var oilFilter = null;     // null | 'all' | 'ok' | 'soon' | 'due' — oil summary filter
  var expandedHistory = {}; // deviceId -> true if its service history is expanded
  var expandedBatch = {};   // batchId -> true if a group reminder batch is expanded
  var expandedOil = {};     // deviceId -> true if its oil card is expanded (collapsed by default)
  // Fleet-wide settings, shared with check-oil-reminders.js via the custom
  // AddInData store (the record whose settingsKey === "global").
  // How aggressively the fleet flags work. Drives the "due soon" windows in
  // the Add-In and in check-oil-reminders.js.
  var CAUTION = {
    lean:     { label:"Run it lean", blurb:"Fewer trucks called in, slightly more risk carried.",
                scoreShift:-1, dueNowPct:0,  dueSoonPct:10, dateDays:7 },
    balanced: { label:"Balanced", blurb:"What most shops run. Enough runway to order parts.",
                scoreShift:0,  dueNowPct:5,  dueSoonPct:20, dateDays:14 },
    safe:     { label:"Play it safe", blurb:"Flag things early. More bay time, fewer surprises.",
                scoreShift:1,  dueNowPct:10, dueSoonPct:30, dateDays:30 }
  };
  var CAUTION_ORDER = ["lean","balanced","safe"];

  // Every alert the automation can send. `id` is what the script checks.
  var ALERT_DEFS = [
    { id:"undrivable",  title:"Anything that can't be driven",        note:"Immediate \u00b7 email to shop and dispatch", def:true },
    { id:"redLamp",     title:"Red stop lamp on",                      note:"Immediate \u00b7 email",                      def:true },
    { id:"safetyItem",  title:"Safety item \u2014 brakes, ABS, steering, tires", note:"Email",                     def:true },
    { id:"oilDue",      title:"Oil change due",                        note:"When the interval is reached \u00b7 email",   def:true },
    { id:"oilSoon",     title:"Oil change coming up",                  note:"At the due-soon window \u00b7 email",         def:true },
    { id:"serviceDue",  title:"Custom service due",                    note:"Daily digest \u00b7 email",                   def:true },
    { id:"serviceDone", title:"Service marked done",                   note:"Custom service confirmation \u00b7 email",    def:true },
    { id:"oilServiceDone", title:"Oil change reset confirmed",          note:"Off by default \u2014 the fleet report already covers it", def:false },
    { id:"stopped",     title:"Truck stopped reporting",               note:"After 7 days of silence \u00b7 email",        def:false },
    { id:"deviceFault", title:"Device / tracker fault",                note:"Email",                                       def:false }
  ];
  function defaultAlerts() {
    var a = {}; ALERT_DEFS.forEach(function (d){ a[d.id] = d.def; }); return a;
  }

  var SEVERITIES = ["critical","high","medium","low","ignore"];
  var SEV_LABEL = { critical:"Severe", high:"Maintenance", medium:"Maintenance", low:"Advisory", ignore:"Device" };

  var DEFAULT_REPORT = {
    enabled:false, frequency:"daily", dayOfWeek:1, time:"07:00",
    timezone:"America/New_York", recipients:"",
    assetMode:"all", groupIds:[], deviceIds:[],
    testPending:false, sendNow:false, sendNowAt:null, lastSentKey:null, lastSentAt:null
  };
  var DEFAULT_SETTINGS = {
    settingsKey:"global",
    defaultEmailTo:null,
    autoResetOil:true,     // false => oil reminders stay due until marked serviced
    autoResetCustom:true,  // false => custom reminders stay due until marked done
    caution:"balanced",    // lean | balanced | safe — see CAUTION
    oilResetSendNow:false, // one-shot: email a summary of recent manual resets
    alertsNormalized:false, // see migrateAlerts() — Setup no longer toggles alerts
    alerts:null,           // { alertId: bool }, defaults from ALERT_DEFS
    faultOverrides:[],     // [{ code, label, from, to, muted, note }]
    report:null
  };
  var globalSettings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));

  // Active caution profile + the thresholds derived from it.
  function caution() { return CAUTION[globalSettings.caution] || CAUTION.balanced; }
  // "Due soon" window for a distance reminder, in miles.
  function soonWindow(intervalUnits) {
    return Math.max(50, Math.round((intervalUnits || DEFAULT_INTERVAL_MILES) * caution().dueSoonPct / 100));
  }
  function alertOn(id) {
    var a = globalSettings.alerts || defaultAlerts();
    return a[id] !== false;
  }
  // Fleet-wide severity override for a fault, matched on code or name.
  function overrideFor(codeOrName) {
    var key = String(codeOrName || "").trim().toLowerCase();
    if (!key) return null;
    var list = globalSettings.faultOverrides || [];
    for (var i=0;i<list.length;i++) {
      var o = list[i];
      var oc = String(o.code||"").trim().toLowerCase();
      if (oc && (oc === key || key.indexOf(oc) >= 0)) return o;
    }
    return null;
  }
  var reportDraft = null;   // working copy of globalSettings.report while editing
  var assetFilterText = ""; // search box in the Reporting asset picker
  var showEmptyGroups = false; // Reporting: reveal groups that hold no vehicles

  // ---- utils ---------------------------------------------------------
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.style.background = C.ink; toastEl.style.color = C.page;
    toastEl.style.opacity = "1"; toastEl.style.transform = "translateX(-50%) translateY(0)";
    clearTimeout(toast._t);
    toast._t = setTimeout(function () {
      toastEl.style.opacity = "0"; toastEl.style.transform = "translateX(-50%) translateY(10px)";
    }, 2400);
  }
  function apiCall(m, p) { return new Promise(function (res, rej) { api.call(m, p, res, rej); }); }
  function multiCall(c) { return new Promise(function (res, rej) { api.multiCall(c, res, rej); }); }
  function fmt(n) { return Math.round(n).toLocaleString(); }
  function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // Outlined status chip: tinted fill, 1px rim in the same hue, uppercase-ish
  // weight. Reads as a state badge rather than a coloured blob.
  function pill(t, bg, fg) {
    return '<span style="font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:2.5px 9px; border-radius:999px; ' +
      'white-space:nowrap; background:'+bg+'; color:'+fg+'; border:1px solid '+fg+'4d; display:inline-block; line-height:1.5;">'+t+'</span>';
  }
  function dot(c) { return '<span style="display:inline-block; width:11px; height:11px; border-radius:50%; background:'+c+'; flex:none;"></span>'; }

  // ---- data ----------------------------------------------------------
  // Serial prefixes for GO devices that sit in a vehicle and report an odometer.
  // This is an ALLOWLIST on purpose. Geotab keeps shipping non-vehicle SKUs
  // (GO Anywhere, E8/E9 puck tags, Oyster trackers) and a blocklist would need
  // editing every time a new one appears, which is how puck tags ended up with
  // oil reminders. "X" covers both X and X2.
  //   G8 -> GO8      G9 / GA -> GO9      X / X2 -> GO10
  var GO_VEHICLE_PREFIXES = ["G8", "G9", "GA", "X"];
  function hasGoVehicleSerial(sn) {
    var s = String(sn || "").toUpperCase().trim();
    for (var i = 0; i < GO_VEHICLE_PREFIXES.length; i++) {
      if (s.indexOf(GO_VEHICLE_PREFIXES[i]) === 0) return true;
    }
    return false;
  }

  // Only real GO-device vehicles: active, valid hardware serial, and a serial
  // prefix that says it's a vehicle-installed GO unit. Asset trackers have no
  // odometer, so mileage-based maintenance tracking on them is meaningless.
  function isRealGoDevice(x) {
    var active = !x.activeTo || new Date(x.activeTo) > new Date();
    if (!active) return false;
    var sn = (x.serialNumber || "").trim();
    // Placeholder/custom assets have empty or all-zero serials
    var hasSerial = sn.length > 0 && !/^0+$/.test(sn) && sn.toUpperCase() !== "NOSERIALNUMBER";
    if (!hasSerial) return false;
    // deviceType for real units is a GoX/GO variant; custom assets are CustomVehicleDevice/CustomDevice/Untracked
    var dt = (x.deviceType || "").toLowerCase();
    if (dt.indexOf("custom") >= 0 || dt.indexOf("untracked") >= 0) return false;
    return hasGoVehicleSerial(sn);
  }

  function getDevices() {
    return apiCall("Get", { typeName: "Device" }).then(function (d) {
      var real = d.filter(isRealGoDevice);
      // Log what was dropped. If a legitimate vehicle ever goes missing from
      // the dashboard, its serial prefix shows up here and gets added above.
      try {
        var skipped = d.filter(function (x){ return !isRealGoDevice(x); });
        if (skipped.length) {
          console.log("[DynastyMaintain] Excluded " + skipped.length + " non-vehicle asset(s): " +
            skipped.map(function (x){ return (x.name || x.id) + " [" + (x.serialNumber || "no serial") + "]"; }).join(" | "));
        }
      } catch (e) {}
      // capture group membership for filtering
      deviceGroups = {};
      real.forEach(function (dev) {
        deviceGroups[dev.id] = (dev.groups || []).map(function (g){ return g.id; });
      });
      return real;
    });
  }

  // Fetch the group tree once; build parent->children map for hierarchical filtering
  function getGroups() {
    return apiCall("Get", { typeName: "Group" }).then(function (groups) {
      allGroups = groups || [];
      groupChildren = {};
      allGroups.forEach(function (g) {
        (g.children || []).forEach(function (c) {
          if (!groupChildren[g.id]) groupChildren[g.id] = [];
          groupChildren[g.id].push(c.id);
          groupParent[c.id] = g.id;
        });
      });
      return allGroups;
    }).catch(function(){ allGroups=[]; return []; });
  }

  // All descendant group ids of a group (inclusive), for hierarchical selection
  function groupWithDescendants(groupId) {
    var out = {}; var stack = [groupId];
    while (stack.length) {
      var g = stack.pop();
      if (out[g]) continue;
      out[g] = true;
      (groupChildren[g] || []).forEach(function (c){ stack.push(c); });
    }
    return out;
  }

  // Filter a device list by the currently selected group (+ its sub-groups)
  function filterByGroup(devices) {
    if (!selectedGroupId) return devices;
    var allowed = groupWithDescendants(selectedGroupId);
    return devices.filter(function (dev) {
      var gs = deviceGroups[dev.id] || [];
      return gs.some(function (gid){ return allowed[gid]; });
    });
  }

  // Geotab built-in classification groups that add clutter, not operational value.
  // We hide these branches (and their descendants) from the group picker + grouping.
  var EXCLUDED_GROUP_NAMES = /^(powertrain and fuel type|asset type|asset information|asset purpose)$/i;
  function isExcludedGroupName(nm) { return EXCLUDED_GROUP_NAMES.test((nm||"").trim()); }

  // Build the dropdown options with indentation to show hierarchy
  function populateGroupSelect() {
    if (!groupSelectEl) return;
    // find roots (groups not listed as anyone's child)
    var isChild = {};
    Object.keys(groupChildren).forEach(function (p){ groupChildren[p].forEach(function (c){ isChild[c]=true; }); });
    var nameById = {}; allGroups.forEach(function (g){ nameById[g.id] = (g.name||"").trim() || g.id; });
    var opts = ['<option value="">All groups (whole fleet)</option>'];
    function walk(id, depth) {
      var nm = nameById[id] || id;
      if (isExcludedGroupName(nm)) return; // skip this branch entirely (and its children)
      // skip the synthetic root-ish entries with blank names
      if (nm && nm !== id) opts.push('<option value="'+esc(id)+'"'+(id===selectedGroupId?' selected':'')+'>'+ "\u00a0\u00a0".repeat(depth) + esc(nm)+'</option>');
      (groupChildren[id] || []).forEach(function (c){ walk(c, depth+1); });
    }
    allGroups.forEach(function (g){ if (!isChild[g.id]) walk(g.id, 0); });
    groupSelectEl.innerHTML = opts.join("");
  }

  // Map of groupId -> name, and parent lookup, for labeling
  function groupNameMap() {
    var m = {}; allGroups.forEach(function (g){ m[g.id] = (g.name||"").trim(); }); return m;
  }
  var groupParent = {}; // childId -> parentId (built alongside groupChildren)
  // Return a device's most specific NAMED group + its ancestor path (["East","East-Trucks"])
  function devicePrimaryGroup(deviceId) {
    var names = groupNameMap();
    // only consider named groups that aren't Geotab classification clutter
    var gs = (deviceGroups[deviceId] || []).filter(function (id){ return names[id] && !isExcludedGroupName(names[id]); });
    if (!gs.length) return { id:null, name:"Ungrouped", path:["Ungrouped"] };
    // pick the deepest (most specific) named group = the one with the longest ancestor chain
    var best = null, bestDepth = -1;
    gs.forEach(function (id) {

  // Daily mileage rate per device, computed from a FULL MONTH of odometer readings
  // using a least-squares linear fit (miles/day) rather than just two endpoints.
  // This reflects the vehicle's actual recent driving pattern, so the oil-change
  // prediction is robust to a truck that sat for a stretch then drove hard, etc.
  function getMileageRates(devices, currentOdoMap) {
    var from = daysAgo(30), to = new Date().toISOString();
    var calls = devices.map(function (d) {
      // pull many points across the month; odometer logs are sparse so this is cheap
      return ["Get", { typeName:"StatusData", resultsLimit: 500, search:{
        deviceSearch:{id:d.id}, diagnosticSearch:{id:"DiagnosticOdometerAdjustmentId"},
        fromDate:from, toDate:to
      }}];
    });
    if (!calls.length) return Promise.resolve({});
    return multiCall(calls).then(function (rs) {
      var rates = {};
      rs.forEach(function (arr, i) {
        var dev = devices[i], curr = currentOdoMap[dev.id];
        rates[dev.id] = null;
        if (!arr || arr.length < 2) return;
        // collect (timeDays, miles) points, oldest→newest, de-duplicated by timestamp
        var pts = [];
        arr.forEach(function (sd) {
          if (sd.data == null || !sd.dateTime) return;
          pts.push({ t: new Date(sd.dateTime).getTime(), mi: sd.data / METERS_PER_UNIT });
        });
        if (curr != null) pts.push({ t: Date.now(), mi: curr / METERS_PER_UNIT }); // anchor with current reading
        if (pts.length < 2) return;
        pts.sort(function (a,b){ return a.t - b.t; });

        var spanDays = (pts[pts.length-1].t - t0) / 86400000;
        var odoGain = pts[pts.length-1].mi - pts[0].mi;

        });
        var denom = (n*sxx - sx*sx);
        var slope = denom !== 0 ? (n*sxy - sx*sy) / denom : (odoGain / spanDays);
        // guard against nonsense; fall back to simple endpoint average if slope is off
        if (!isFinite(slope) || slope <= 0) slope = odoGain / spanDays;
        rates[dev.id] = slope; // miles per day
      });
      return rates;
    }).catch(function (e) {
      console.warn("mileage rate failed:", e && e.message);
      return {};
    });

  // Sensors: recent StatusData per device, matched to tire pressure (per corner),

    var isFront = /front/.test(n), isRear = /rear/.test(n);
    var isLeft = /left/.test(n), isRight = /right/.test(n);
    if (isFront && isLeft) return "fl";
    if (isFront && isRight) return "fr";
    if (isRear && isLeft) return "rl";

    // days retry with a 30-day window and are flagged as "sitting".
    var from = daysAgo(7), to = new Date().toISOString();

      return ["Get", { typeName:"StatusData", resultsLimit: 5000, search:{
        deviceSearch:{id:d.id}, fromDate:from, toDate:to
      }}];
    });

            deviceSearch:{id:devices[i].id}, fromDate:wideFrom, toDate:to
          }}]);

  // Faults with per-fault detail retained, grouped per device.

  // counting only LIVE faults (active, not dismissed/cleared) — matching MyGeotab's view.
  // Dismissed/cleared faults are tallied separately so they can be shown but not inflate counts.
  function faultSummary(fi) {
    var s = { distinct:0, red:0, amber:0, deviceCount:0, vehicleCount:0, dismissedCount:0, total:0 };
    if (!fi || !fi.items || !fi.items.length) return s;
    function isDev(it) {
      if (it.isDevice) return true;
      var nm = (diagNameCache[it.diagId] || it.code || "").toLowerCase();
      return /telematics|device type|invalid device|iox|harness|go device|gps|antenna|watchdog|firmware|tamper|unplug|reader|add-on|internal reset|listen only|can bus/.test(nm);

  function getFaults(devices) {
    var call = apiCall("Get", { typeName:"FaultData", resultsLimit: 5000, search:{ fromDate:daysAgo(FAULT_LOOKBACK_DAYS), toDate:new Date().toISOString() } })
      .then(function (faults) {

        var rawSevSeen = {}; // for diagnostic logging
        faults.forEach(function (f) {
          var did = f.device && f.device.id; if (!did) return;
          if (!by[did]) by[did] = { items:[] };

          // (e.g. "Critical", "Warning", "None"). Some databases also expose an enriched
          // severity. We keep the raw string so riskRating can trust it over keyword guessing.

            diagId: diagId,

            controller: f.controller && f.controller.id ? f.controller.id : "",
            rawSeverity: rawSev,      // Geotab's verbatim severity string
            sevLow: sevLow,
            severity: (sevLow.indexOf("crit")>=0 || sevLow.indexOf("severe")>=0 || sevLow.indexOf("high")>=0) ? "critical" : "warning", // coarse, for grouping keys
            isDevice: isDevice,
            first: f.dateTime || f.activeFrom || null,
            state: st,
            live: live,
            dismissed: dismissed || cleared
          });
        });
        try { console.log("[DynastyMaintain] Raw fault severities seen:", JSON.stringify(rawSevSeen)); } catch(e){}
        return by;
      });

    var timeout = new Promise(function (resolve) {

    });
    return Promise.race([call, timeout]).then(function (r) {

    }).catch(function (e) {

    });

  // Resolve diagnostic names for the codes we actually have (cached)

    });

    return multiCall(calls).then(function (rs) {
      rs.forEach(function (r, i) {
        var name = (r && r.length && (r[0].name || r[0].code)) ? (r[0].name || r[0].code) : list[i];
        diagNameCache[list[i]] = name;
