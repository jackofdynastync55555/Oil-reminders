  function oilSumCard(num, label, fg, filterKey, total) {
    return statCard(num, total, label + ' \u203a', fg,
      'data-oilfilter="'+filterKey+'"', oilFilter===filterKey, filterKey!=="all");
  }
  function persistOil(rec, det, device, oilMap) {
    var entity = { addInId:ADD_IN_ID, groups:[{id:"GroupCompanyId"}], details:det };
    var method = rec&&rec.id?"Set":"Add"; if (rec&&rec.id) entity.id = rec.id;
    return apiCall(method, { typeName:"AddInData", entity:entity }).then(function (newId) {
      if (!rec) rec = { id:newId, details:det }; else rec.details = det; oilMap[device.id] = rec;
    });
  }

  // ---- CUSTOM REMINDERS tab ------------------------------------------
  function persistCustom(rec) {
    var entity = { addInId:CUSTOM_ADD_IN_ID, groups:[{id:"GroupCompanyId"}], details:rec.details };
    var method = rec.id ? "Set" : "Add"; if (rec.id) entity.id = rec.id;
    return apiCall(method, { typeName:"AddInData", entity:entity }).then(function (newId) {
      if (!rec.id) rec.id = newId; return rec;
    });
  }
  function deleteCustom(rec) {
    if (!rec.id) return Promise.resolve();
    return apiCall("Remove", { typeName:"AddInData", entity:{ id:rec.id, addInId:CUSTOM_ADD_IN_ID } });
  }

  function renderCustom(devices, odoMap, customList) {
    if (!customEl) return;
    customList = customList || [];
    var odoByDevice = odoMap || {};
    var nameById = {}; devices.forEach(function (d){ nameById[d.id] = d.name; });

    // How many reminders each asset already has, and which names are taken.
    // Multiple reminders per asset are allowed (up to MAX_CUSTOM_PER_ASSET);
    // duplicate names on the same asset are not, so a group re-add is safe to repeat.
    var countByDevice = {}, labelsByDevice = {};
    customList.forEach(function (r) {
      var dd = r.details; if (!dd || !dd.deviceId) return;
      countByDevice[dd.deviceId] = (countByDevice[dd.deviceId] || 0) + 1;
      if (!labelsByDevice[dd.deviceId]) labelsByDevice[dd.deviceId] = {};
      labelsByDevice[dd.deviceId][String(dd.label || "Reminder").trim().toLowerCase()] = true;
    });
    function slotsLeft(deviceId) { return MAX_CUSTOM_PER_ASSET - (countByDevice[deviceId] || 0); }
    function hasLabel(deviceId, label) {
      var m = labelsByDevice[deviceId]; if (!m) return false;
      return !!m[String(label || "Reminder").trim().toLowerCase()];
    }

    // ---- add form ----
    var deviceOpts = devices.map(function (d) {
      return '<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>';
    }).join("");
    // real operational groups only (exclude Geotab classification clutter)
    var names = groupNameMap();
    var groupOpts = allGroups.filter(function (g) {
      return names[g.id] && !isExcludedGroupName(names[g.id]);
    }).map(function (g) {
      // count vehicles in this group + descendants
      var allowed = groupWithDescendants(g.id);
      var count = devices.filter(function (dev){ return (deviceGroups[dev.id]||[]).some(function (gid){ return allowed[gid]; }); }).length;
      return '<option value="'+esc(g.id)+'">'+esc(names[g.id])+' ('+count+' vehicle'+(count===1?'':'s')+')</option>';
    }).join("");

    var form =
      '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:'+C.shadow+';">' +
        '<div style="font-size:14px; font-weight:650; color:'+C.ink+'; margin-bottom:12px;">Add a custom reminder</div>' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">' +
          '<label style="font-size:12px; color:'+C.soft+';">Apply to<br><select id="cr-mode" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"><option value="asset">A single asset</option><option value="group">A whole group</option></select></label>' +
          '<label id="cr-asset-wrap" style="font-size:12px; color:'+C.soft+';">Asset<br><select id="cr-device" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:170px;">'+deviceOpts+'</select></label>' +
          '<label id="cr-group-wrap" style="display:none; font-size:12px; color:'+C.soft+';">Group<br><select id="cr-group" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:200px;">'+(groupOpts||'<option value="">No groups found</option>')+'</select></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Reminder name<br><input id="cr-label" type="text" placeholder="e.g. Brake inspection" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:170px;"></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Type<br><select id="cr-type" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"><option value="mi">Every X miles</option><option value="days">Every X days</option></select></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Interval<br><input id="cr-interval" type="number" min="1" value="5000" style="margin-top:4px; width:100px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';"></label>' +
          '<label style="font-size:12px; color:'+C.soft+';">Email to<br><input id="cr-email" type="text" placeholder="optional" style="margin-top:4px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+'; min-width:150px;"></label>' +
          '<button id="cr-add" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Add reminder</button>' +
        '</div>' +
        '<div id="cr-asset-note" style="font-size:11.5px; color:'+C.soft+'; margin-top:10px;"></div>' +
        '<div id="cr-mode-note" style="font-size:11.5px; color:'+C.soft+'; margin-top:6px; display:none;">A separate reminder will be created for each vehicle in the group, each tracking its own mileage. Up to '+MAX_CUSTOM_PER_ASSET+' custom reminders per asset — vehicles already at the limit, or that already have a reminder with this name, are skipped.</div>' +
      '</div>';

    // ---- existing reminders ----
    // Build a single reminder card's inner HTML (used standalone and inside batches)
    // insideBatch = compact child card in a group batch (titled by vehicle).
    // hideAsset  = card sits under a per-asset header, so the vehicle name is
    //              already shown above and only the interval is repeated.
    function reminderCard(rec, insideBatch, hideAsset) {
      var d = rec.details;
      var unit = d.type === "days" ? "days" : UNITS;
      var progress, remaining, pct;
      if (d.type === "days") {
        var start = d.baselineDate ? new Date(d.baselineDate).getTime() : Date.now();
        var elapsed = (Date.now() - start) / 86400000;
        progress = elapsed; remaining = d.interval - elapsed;
        pct = Math.max(0, Math.min(100, (elapsed / d.interval) * 100));
      } else {
        var odo = odoByDevice[d.deviceId];
        var since = odo!=null && d.baselineMeters!=null ? (odo - d.baselineMeters)/METERS_PER_UNIT : 0;
        progress = since; remaining = d.interval - since;
        pct = Math.max(0, Math.min(100, (since / d.interval) * 100));
      }
      var pillHtml, fill;
      if (d.enabled===false){ pillHtml=pill("Off",C.track,C.faint); fill=C.faint; }
      else if (remaining<=0){ pillHtml=pill("Due now",C.redBg,C.red); fill=C.red; }
      else if (pct>=85){ pillHtml=pill("Due soon",C.amberBg,C.amber); fill=C.amber; }
      else { pillHtml=pill(fmt(Math.max(0,remaining))+" "+unit+" left",C.greenBg,C.green); fill=C.green; }

      var histHtml = "";
      // preserve original indices so deletes hit the right entry after sorting
      // wrappers keep the original index; the stored entries stay untouched
      var hist = (d.history||[]).map(function (e,i){ return { e:e, i:i }; })
        .sort(function (a,b){ return new Date(b.e.date)-new Date(a.e.date); });
      if (hist.length) {
        histHtml = '<div style="margin-top:10px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<div style="display:flex; align-items:center; gap:9px; margin-bottom:5px;">' +
            '<span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+';">History</span>' +
            '<span style="flex:1;"></span>' +
            '<button data-crhistclear="1" style="border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:6px; padding:1px 9px; font-size:10.5px; font-weight:650; cursor:pointer;">Clear</button>' +
          '</div>' +
          hist.map(function (w){
            var e = w.e;
            var val = d.type==="days" ? (e.date?new Date(e.date).toLocaleDateString():"") : (e.odoMeters!=null?fmt(e.odoMeters/METERS_PER_UNIT)+" "+UNITS:"—");
            var dt = e.date ? new Date(e.date).toLocaleDateString() : "";
            var isAuto = e.source==="auto";
            var badge = e.backfilled
              ? '<span style="font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:'+C.purpleBg+'; color:'+C.purple+'; margin-left:6px;">logged</span>'
              : isAuto
              ? '<span style="font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:'+C.amberBg+'; color:'+C.amber+'; margin-left:6px;">auto</span>'
              : '<span style="font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:'+C.greenBg+'; color:'+C.green+'; margin-left:6px;">done</span>';
            return '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; color:'+C.soft+'; padding:3px 0;">' +
              '<span>'+dt+' \u00b7 '+esc(d.label||"Reminder")+badge+'</span>' +
              '<span style="display:flex; align-items:center; gap:8px;">' +
                '<span style="color:'+C.ink+';">'+val+'</span>' +
                '<button data-crhistdel="'+w.i+'" title="Delete this entry" style="border:1px solid '+C.line+'; background:transparent; color:'+C.faint+'; border-radius:5px; padding:0 6px; font-size:11.5px; line-height:1.5; cursor:pointer;">\u00d7</button>' +
              '</span></div>';
          }).join("") +
          '<div style="font-size:10.5px; color:'+C.faint+'; margin-top:6px;">Deleting entries only edits the log \u2014 the reminder\u2019s counter is unchanged.</div>' +
          '</div>';
      }
      // Backfill, same idea as the Oil tab: record a completion that actually
      // happened earlier. Distance reminders need the odometer reading; time
      // reminders only need the date.
      var crBf =
        '<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<span style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+';">Log a past completion</span>' +
          (d.type === "days" ? '' :
            '<input data-crbf="odo" type="number" min="1" step="1" placeholder="odometer at service" style="width:150px; padding:5px 8px; border:1px solid '+C.line+'; border-radius:7px; font-size:12.5px; background:'+(insideBatch?C.card:C.card2)+'; color:'+C.ink+'; color-scheme:dark;">' +
            '<span style="font-size:12px; color:'+C.soft+';">'+UNITS+'</span>') +
          '<input data-crbf="date" type="date" style="padding:5px 8px; border:1px solid '+C.line+'; border-radius:7px; font-size:12.5px; background:'+(insideBatch?C.card:C.card2)+'; color:'+C.ink+'; color-scheme:dark;">' +
          '<button data-crbf="add" style="border:1px solid '+C.brand+'8c; background:'+C.brandSoft+'; color:'+C.brand+'; border-radius:7px; padding:5px 11px; font-size:12px; font-weight:650; cursor:pointer;">Add</button>' +
        '</div>';

      var margin = insideBatch ? "margin:8px 0 0;" : "margin-bottom:8px;";
      var titleLine;
      if (insideBatch) {
        titleLine = '<div><span style="font-size:14px; font-weight:600; color:'+C.ink+';">'+esc(d.deviceName||nameById[d.deviceId]||"")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">every '+fmt(d.interval)+' '+unit+'</div></div>';
      } else if (hideAsset) {
        // vehicle name already shown in the section header above this card
        titleLine = '<div><span style="font-size:14.5px; font-weight:650; color:'+C.ink+';">'+esc(d.label||"Reminder")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">every '+fmt(d.interval)+' '+unit+'</div></div>';
      } else {
        titleLine = '<div><span style="font-size:15px; font-weight:650; color:'+C.ink+';">'+esc(d.label||"Reminder")+'</span>' +
          '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">'+esc(d.deviceName||nameById[d.deviceId]||"")+' \u00b7 every '+fmt(d.interval)+' '+unit+'</div></div>';
      }

      var crTint = 'linear-gradient(90deg,'+fill+'24 0%,'+fill+'0d 210px,'+(insideBatch?C.card2:C.card)+' 460px)';
      return '<div data-crid="'+esc(rec.id)+'" style="background:'+crTint+'; border:1px solid '+fill+'40; border-left:4px solid '+fill+'; border-radius:12px; padding:11px 13px; '+margin+' '+(insideBatch?'':'box-shadow:'+C.shadow+';')+'">' +
        '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px;">' +
          titleLine + pillHtml +
        '</div>' +
        '<div style="height:8px; background:'+C.track+'; border-radius:999px; overflow:hidden;"><div style="height:100%; width:'+pct+'%; border-radius:999px; background:'+fill+';"></div></div>' +
        '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:11px; padding-top:10px; border-top:1px solid '+C.line+';">' +
          '<label style="display:flex; align-items:center; gap:7px; font-size:13px; color:'+C.soft+'; cursor:pointer;"><input type="checkbox" data-cr="enabled" '+(d.enabled!==false?"checked":"")+' style="width:15px; height:15px;"> On</label>' +
          '<button data-cr="edit-email" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Email\u2026</button>' +
          '<span style="flex:1;"></span>' +
          '<button data-cr="complete" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Mark done</button>' +
          '<button data-cr="delete" style="border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;">Delete</button>' +
        '</div>' +
        crBf +
        histHtml +
      '</div>';
    }

    var listHtml = "";
    if (!customList.length) {
      listHtml = '<div style="text-align:center; color:'+C.soft+'; padding:22px 18px;">No custom reminders yet. Add one above.</div>';
    } else {
      // separate batch reminders from standalone ones
      var batches = {}, standalone = [];
      customList.forEach(function (rec) {
        var b = rec.details.batchId;
        if (b) { if (!batches[b]) batches[b]=[]; batches[b].push(rec); }
        else standalone.push(rec);
      });

      // render each batch as a collapsible line
      Object.keys(batches).forEach(function (bId) {
        var recs = batches[bId];
        var d0 = recs[0].details;
        var unit = d0.type === "days" ? "days" : UNITS;
        var isOpen = !!expandedBatch[bId];
        // batch summary status: worst of the group
        var anyDue=false, anySoon=false, onCount=0;
        recs.forEach(function (r){
          var dd=r.details; if (dd.enabled!==false) onCount++;
          var rem;
          if (dd.type==="days"){ var st=dd.baselineDate?new Date(dd.baselineDate).getTime():Date.now(); rem=dd.interval-((Date.now()-st)/86400000); }
          else { var o=odoByDevice[dd.deviceId]; var s=o!=null&&dd.baselineMeters!=null?(o-dd.baselineMeters)/METERS_PER_UNIT:0; rem=dd.interval-s; }
          if (dd.enabled!==false){ if (rem<=0) anyDue=true; else if (rem<=dd.interval*0.15) anySoon=true; }
        });
        var bPill = anyDue?pill(recs.length+" vehicles \u00b7 some due",C.redBg,C.red)
                  : anySoon?pill(recs.length+" vehicles \u00b7 due soon",C.amberBg,C.amber)
                  : pill(recs.length+" vehicles \u00b7 on track",C.greenBg,C.green);

        var inner = "";
        if (isOpen) {
          inner = '<div style="margin-top:10px; padding-top:10px; border-top:1px solid '+C.line+';">' +
            '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">' +
              '<span style="font-size:12px; color:'+C.soft+';">Set interval for all:</span>' +
              '<input data-batchinterval="'+esc(bId)+'" type="number" min="1" value="'+d0.interval+'" style="width:100px; padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card+'; color:'+C.ink+';"> '+unit +
              '<button data-batchsave="'+esc(bId)+'" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Apply to all '+recs.length+'</button>' +
              '<button data-batchdelete="'+esc(bId)+'" style="border:1px solid '+C.line+'; background:transparent; color:'+C.red+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Delete all</button>' +
            '</div>' +
            recs.map(function (r){ return reminderCard(r, true); }).join("") +
          '</div>';
        }

        listHtml += '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:'+C.shadow+';">' +
          '<div data-batchtoggle="'+esc(bId)+'" style="display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none;">' +
            '<span style="font-size:14px; color:'+C.faint+'; width:12px;">'+(isOpen?"\u25be":"\u25b8")+'</span>' +
            '<div style="flex:1;"><span style="font-size:15px; font-weight:650; color:'+C.ink+';">'+esc(d0.label||"Reminder")+'</span>' +
            '<div style="font-size:12px; color:'+C.soft+'; margin-top:2px;">'+esc(d0.batchGroupName||"Group")+' \u00b7 '+recs.length+' vehicles \u00b7 every '+fmt(d0.interval)+' '+unit+'</div></div>' +
            bPill +
          '</div>' + inner +
        '</div>';
      });

      // standalone reminders as normal cards — cluster by asset so a vehicle's
      // multiple reminders sit together, then alphabetical by reminder name
      standalone.sort(function (a, b) {
        var an = (a.details.deviceName || nameById[a.details.deviceId] || "").toLowerCase();
        var bn = (b.details.deviceName || nameById[b.details.deviceId] || "").toLowerCase();
        if (an !== bn) return an < bn ? -1 : 1;
        var al = String(a.details.label || "").toLowerCase(), bl = String(b.details.label || "").toLowerCase();
        return al < bl ? -1 : al > bl ? 1 : 0;
      });
      // With up to MAX_CUSTOM_PER_ASSET reminders per vehicle, repeat the asset
      // name once as a header instead of on every card.
      var lastDevice = null;
      standalone.forEach(function (rec) {
        var did = rec.details.deviceId;
        if (did !== lastDevice) {
          lastDevice = did;
          var used = countByDevice[did] || 0;
          listHtml +=
            '<div style="display:flex; align-items:center; gap:9px; margin:14px 3px 7px;">' +
              '<span style="font-size:12.5px; font-weight:700; letter-spacing:.01em; color:'+C.ink+';">'+esc(rec.details.deviceName || nameById[did] || "Unknown asset")+'</span>' +
              '<span style="flex:1; height:1px; background:linear-gradient(90deg,'+C.line+',rgba(0,0,0,0));"></span>' +
              '<span style="font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:'+(used>=MAX_CUSTOM_PER_ASSET?C.amber:C.faint)+';">'+used+' / '+MAX_CUSTOM_PER_ASSET+'</span>' +
            '</div>';
        }
        listHtml += reminderCard(rec, false, true);
      });
    }

    var settingsBar =
      '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:9px 13px; margin-bottom:8px; box-shadow:'+C.shadow+'; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
        '<span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:'+C.soft+';">Default email recipients</span>' +
        '<span id="cr-default-email" style="flex:1; min-width:180px; font-size:13px; color:'+C.ink+';">'+esc((globalSettings&&globalSettings.defaultEmailTo)||"(none set — using fleet address)")+'</span>' +
        '<button id="cr-edit-default" style="border:1px solid '+C.line+'; background:transparent; color:'+C.brand+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Edit</button>' +
      '</div>';

    var crTotal = customList.filter(function (r){ return r.details && r.details.deviceId; }).length;
    var crDue = customList.filter(function (r) {
      var d = r.details;
      if (!d || !d.deviceId || d.enabled === false) return false;
      if (d.type === "days") {
        var st = d.baselineDate ? new Date(d.baselineDate).getTime() : Date.now();
        return (Date.now() - st)/86400000 >= d.interval;
      }
      var o = odoByDevice[d.deviceId];
      return o != null && d.baselineMeters != null && (o - d.baselineMeters)/METERS_PER_UNIT >= d.interval;
    }).length;
    var crHeader = sectionLabel(
      "Service across the fleet",
      crTotal + " item" + (crTotal===1?"":"s") + " \u00b7 " + crDue + " due now",
      resetModePill(globalSettings.autoResetCustom !== false));
    customEl.innerHTML = form + settingsBar + crHeader + '<div id="cr-list">' + listHtml + '</div>';

    // wire default-recipients editor
    var editDefault = $("cr-edit-default");
    if (editDefault) editDefault.addEventListener("click", function () {
      var current = (globalSettings && globalSettings.defaultEmailTo) || "";
      var input = window.prompt("Default email recipients for ALL reminders (comma-separated). Individual reminders can override this:", current);
      if (input === null) return;
      var det = { defaultEmailTo: input.trim() || null };
      patchSettings(det).then(function () { toast("Default recipients saved"); renderCustom(devices, odoMap, customList); });
    });

    // wire mode toggle (asset vs group) + per-asset slot counter
    var modeSel = $("cr-mode");
    function refreshAssetNote() {
      var note = $("cr-asset-note"), sel = $("cr-device");
      if (!note) return;
      if (!modeSel || modeSel.value === "group" || !sel || !sel.value) { note.style.display = "none"; return; }
      var used = countByDevice[sel.value] || 0;
      var left = MAX_CUSTOM_PER_ASSET - used;
      note.style.display = "";
      note.style.color = left <= 0 ? C.red : C.soft;
      note.textContent = left <= 0
        ? (nameById[sel.value]||"This asset")+" is at the "+MAX_CUSTOM_PER_ASSET+"-reminder limit — delete one to add another."
        : used+" of "+MAX_CUSTOM_PER_ASSET+" reminders used on this asset \u00b7 "+left+" slot"+(left===1?"":"s")+" left";
    }
    if (modeSel) modeSel.addEventListener("change", function () {
      var isGroup = modeSel.value === "group";
      var aw = $("cr-asset-wrap"), gw = $("cr-group-wrap"), note = $("cr-mode-note");
      if (aw) aw.style.display = isGroup ? "none" : "";
      if (gw) gw.style.display = isGroup ? "" : "none";
      if (note) note.style.display = isGroup ? "" : "none";
      refreshAssetNote();
    });
    var devSel = $("cr-device");
    if (devSel) devSel.addEventListener("change", refreshAssetNote);
    refreshAssetNote();

    // wire add form
    var addBtn = $("cr-add");
    if (addBtn) addBtn.addEventListener("click", function () {
      var mode = $("cr-mode").value;
      var label = ($("cr-label").value || "").trim() || "Reminder";
      var type = $("cr-type").value;
      var interval = Number($("cr-interval").value) || 0;
      var email = ($("cr-email").value || "").trim();
      if (interval <= 0) { toast("Enter a valid interval"); return; }

      function makeDet(deviceId, batchId, batchGroupName) {
        return {
          deviceId: deviceId, deviceName: nameById[deviceId] || "",
          label: label, type: type, interval: interval,
          baselineMeters: type==="mi" ? (odoByDevice[deviceId]||0) : null,
          baselineDate: new Date().toISOString(),
          enabled: true, emailTo: email || null, emailPending: false, history: [],
          batchId: batchId || null, batchGroupName: batchGroupName || null
        };
      }

      if (mode === "group") {
        var groupId = $("cr-group").value;
        if (!groupId) { toast("Pick a group"); return; }
        var allowed = groupWithDescendants(groupId);
        var inGroup = devices.filter(function (dev){ return (deviceGroups[dev.id]||[]).some(function (gid){ return allowed[gid]; }); });
        if (!inGroup.length) { toast("No vehicles in that group"); return; }
        // skip assets at the per-asset cap, or that already use this reminder name
        var atCap = 0, dupName = 0;
        var targets = inGroup.filter(function (dev) {
          if (hasLabel(dev.id, label)) { dupName++; return false; }
          if (slotsLeft(dev.id) <= 0) { atCap++; return false; }
          return true;
        });
        if (!targets.length) {
          if (dupName && !atCap) toast('All '+inGroup.length+' vehicles already have a "'+label+'" reminder');
          else toast("No eligible vehicles — "+atCap+" at the "+MAX_CUSTOM_PER_ASSET+"-reminder limit, "+dupName+" already using that name");
          return;
        }
        var batchId = "batch_" + Date.now() + "_" + Math.floor(Math.random()*100000);
        var gName = (groupNameMap()[groupId] || "Group");
        Promise.all(targets.map(function (dev){ return persistCustom({ id:null, details:makeDet(dev.id, batchId, gName) }); }))
          .then(function () {
            var msg = '"'+label+'" added to '+targets.length+' vehicle'+(targets.length===1?'':'s');
            var notes = [];
            if (dupName>0) notes.push(dupName+" already had it");
            if (atCap>0) notes.push(atCap+" at the "+MAX_CUSTOM_PER_ASSET+"-reminder limit");
            if (notes.length) msg += " ("+notes.join(", ")+")";
            toast(msg); reloadAll();
          });
      } else {
        var deviceId = $("cr-device").value;
        if (!deviceId) { toast("Pick an asset"); return; }
        if (hasLabel(deviceId, label)) { toast((nameById[deviceId]||"That asset")+' already has a "'+label+'" reminder — use a different name'); return; }
        if (slotsLeft(deviceId) <= 0) { toast((nameById[deviceId]||"That asset")+" is at the "+MAX_CUSTOM_PER_ASSET+"-reminder limit — delete one first"); return; }
        persistCustom({ id:null, details:makeDet(deviceId, null, null) }).then(function () { toast('"'+label+'" added'); reloadAll(); });
      }
    });

    // wire per-card actions
    customList.forEach(function (rec) {
      var cardEl = customEl.querySelector('[data-crid="'+cssIdSel(rec.id)+'"]');
      if (!cardEl) return;
      var enabledCb = cardEl.querySelector('[data-cr="enabled"]');
      var completeBtn = cardEl.querySelector('[data-cr="complete"]');
      var deleteBtn = cardEl.querySelector('[data-cr="delete"]');

      // history: delete one entry, or clear the whole log for this reminder
      cardEl.querySelectorAll('[data-crhistdel]').forEach(function (b) {
        b.addEventListener("click", function (ev) {
          ev.stopPropagation();
          var idx = Number(b.getAttribute("data-crhistdel"));
          var d = rec.details;
          if (!d.history || idx < 0 || idx >= d.history.length) return;
          d.history.splice(idx, 1);
          persistCustom(rec).then(function () { toast("History entry deleted"); reloadAll(); })
            .catch(function (e){ toast("Delete failed: "+(e&&e.message?e.message:e)); });
        });
      });
      var histClear = cardEl.querySelector('[data-crhistclear]');
      if (histClear) histClear.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var d = rec.details;
        if (!window.confirm('Delete the entire history for "'+(d.label||"this reminder")+'"?\n\nThe reminder\u2019s counter is not affected.')) return;
        d.history = [];
        persistCustom(rec).then(function () { toast("History cleared"); reloadAll(); })
          .catch(function (e){ toast("Clear failed: "+(e&&e.message?e.message:e)); });
      });
      if (enabledCb) enabledCb.addEventListener("change", function () {
        rec.details.enabled = enabledCb.checked;
        persistCustom(rec).then(function () { toast("Updated"); });
      });
      if (completeBtn) completeBtn.addEventListener("click", function () {
        var d = rec.details;
        if (!d.history) d.history = [];
        var odo = odoByDevice[d.deviceId];
        var nowIso = new Date().toISOString();
        d.history.push({ date: nowIso, odoMeters: d.type==="mi" ? odo : null, source: "manual" });
        if (d.type==="mi") d.baselineMeters = odo!=null ? odo : d.baselineMeters;
        d.baselineDate = nowIso;
        // Flag consumed by check-oil-reminders.js on its next run — it sends the
        // completion confirmation and clears these three fields.
        d.emailPending = true;
        d.emailPendingReason = "completed";
        d.emailPendingOdoMeters = (d.type==="mi" && odo!=null) ? odo : null;
        d.emailPendingDate = nowIso;
        d.deviceName = d.deviceName || nameById[d.deviceId] || "";
        persistCustom(rec).then(function () { toast(d.label+" marked done — confirmation queued"); reloadAll(); });
      });
      if (deleteBtn) deleteBtn.addEventListener("click", function () {
        deleteCustom(rec).then(function () { toast("Reminder deleted"); reloadAll(); });
      });
      var crBfAdd = cardEl.querySelector('[data-crbf="add"]');
      if (crBfAdd) crBfAdd.addEventListener("click", function () {
        var d = rec.details;
        var raw = (cardEl.querySelector('[data-crbf="date"]')||{}).value;
        var when = raw ? new Date(raw + "T12:00:00") : new Date();
        if (isNaN(when.getTime())) { toast("Enter a valid date"); return; }
        if (when.getTime() > Date.now() + 86400000) { toast("That date is in the future"); return; }
        var meters = null;
        if (d.type !== "days") {
          var miles = Number((cardEl.querySelector('[data-crbf="odo"]')||{}).value);
          if (!isFinite(miles) || miles <= 0) { toast("Enter the odometer reading at the time of service"); return; }
          var curOdo = odoByDevice[d.deviceId];
          if (curOdo != null && miles > curOdo/METERS_PER_UNIT + 1) {
            toast("That is past the current odometer ("+fmt(curOdo/METERS_PER_UNIT)+" "+UNITS+")"); return;
          }
          meters = miles * METERS_PER_UNIT;
        }
        var atTxt = meters != null ? " at "+fmt(meters/METERS_PER_UNIT)+" "+UNITS : "";
        if (!window.confirm('Record "'+(d.label||"this reminder")+'" as completed on '+when.toLocaleDateString()+atTxt+"?\n\nThe counter restarts from that point.")) return;
        if (!d.history) d.history = [];
        d.history.push({ date: when.toISOString(), odoMeters: meters, source: "manual", backfilled: true });
        if (d.type !== "days" && meters != null) d.baselineMeters = meters;
        d.baselineDate = when.toISOString();
        d.deviceName = d.deviceName || nameById[d.deviceId] || "";
        // No emailPending — a backfill is a log correction, not a completion,
        // so it must not queue a "marked done" confirmation email.
        persistCustom(rec).then(function () { toast("Logged past completion"); reloadAll(); })
          .catch(function (e){ toast("Save failed: "+(e&&e.message?e.message:e)); });
      });
      var emailBtn = cardEl.querySelector('[data-cr="edit-email"]');
      if (emailBtn) emailBtn.addEventListener("click", function () {
        var current = rec.details.emailTo || "";
        var input = window.prompt("Email recipients for \""+(rec.details.label||"reminder")+"\" (comma-separated). Leave blank to use the fleet default:", current);
        if (input === null) return; // cancelled
        rec.details.emailTo = input.trim() || null;
        persistCustom(rec).then(function () { toast("Recipients updated"); });
      });
    });

    // wire batch toggles + batch edit/delete
    customEl.querySelectorAll('[data-batchtoggle]').forEach(function (el) {
      el.addEventListener("click", function () {
        var b = el.getAttribute("data-batchtoggle");
        expandedBatch[b] = !expandedBatch[b];
        renderCustom(devices, odoMap, customList);
      });
    });
    customEl.querySelectorAll('[data-batchsave]').forEach(function (el) {
      el.addEventListener("click", function () {
        var b = el.getAttribute("data-batchsave");
        var input = customEl.querySelector('[data-batchinterval="'+cssIdSel(b)+'"]');
        var newInterval = Number(input && input.value) || 0;
        if (newInterval <= 0) { toast("Enter a valid interval"); return; }
        var recs = customList.filter(function (r){ return r.details.batchId === b; });
        Promise.all(recs.map(function (r){ r.details.interval = newInterval; return persistCustom(r); }))
          .then(function () { toast("Updated interval for "+recs.length+" vehicles"); reloadAll(); });
      });
    });
    customEl.querySelectorAll('[data-batchdelete]').forEach(function (el) {
      el.addEventListener("click", function () {
        var b = el.getAttribute("data-batchdelete");
        var recs = customList.filter(function (r){ return r.details.batchId === b; });
        Promise.all(recs.map(function (r){ return deleteCustom(r); }))
          .then(function () { toast("Deleted "+recs.length+" reminders"); reloadAll(); });
      });
    });
  }
  // Walk the Geotab group tree root-to-leaf, handing back depth so callers can
  // render the real hierarchy instead of a flat list. Excluded classification
  // branches are pruned along with their descendants.
  function walkGroupTree(cb) {
    var isChild = {};
    Object.keys(groupChildren).forEach(function (p){ groupChildren[p].forEach(function (c){ isChild[c] = true; }); });
    var names = groupNameMap();
    var seen = {};
    function walk(id, depth) {
      if (seen[id]) return; seen[id] = true;
      var nm = names[id];
      if (isExcludedGroupName(nm)) return; // prune the whole branch
      var kids = (groupChildren[id] || []).slice();
      if (nm && nm !== id) { cb(id, nm, depth); depth = depth + 1; }
      kids.sort(function (a, b){ return String(names[a]||"").localeCompare(String(names[b]||"")); });
      kids.forEach(function (c){ walk(c, depth); });
    }
    var roots = allGroups.filter(function (g){ return !isChild[g.id]; });
    roots.sort(function (a, b){ return String(names[a.id]||"").localeCompare(String(names[b.id]||"")); });
    roots.forEach(function (g){ walk(g.id, 0); });
  }

  // Devices belonging to a group or any of its descendants.
  function devicesInGroup(allDevices, groupId) {
    var allowed = groupWithDescendants(groupId);
    return allDevices.filter(function (d){ return (deviceGroups[d.id]||[]).some(function (gid){ return allowed[gid]; }); });
  }

  function cssIdSel(s) { return String(s).replace(/["\\]/g,"\\$&"); }

  // ---- REPORTING tab ---------------------------------------------------
  // Mirrors the row logic in check-oil-reminders.js so the CSV you download
  // here matches the spreadsheet that gets emailed on schedule.
  // Most recent completed service from a reminder's history, preferring manual
  // confirmations over auto-resets. Mirrors lastServiceFrom() in the script.
  function lastServiceFrom(det) {
    var hist = (det && det.history) || [];
    if (!hist.length) return { date:null, odoMeters:null, source:null };
    var sorted = hist.slice().sort(function (a,b){ return new Date(b.date) - new Date(a.date); });
    var manual = null;
    for (var i=0;i<sorted.length;i++) { if (sorted[i].source === "manual") { manual = sorted[i]; break; } }
    var pick = manual || sorted[0];
    return { date: pick.date || null, odoMeters: pick.odoMeters != null ? pick.odoMeters : null, source: pick.source || null };
  }
  function fmtServiceDate(iso) {
    if (!iso) return "\u2014";
    var d = new Date(iso);
    if (isNaN(d)) return "\u2014";
    return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
  }

  function buildReportRows(devices) {
    var customByDevice = {};
    (cache.customList || []).forEach(function (r) {
      var d = r.details;
      if (!d || !d.deviceId || d.settingsKey === "global" || d.enabled === false) return;
      var due = false, soon = false;
      if (d.type === "days") {
        var st = d.baselineDate ? new Date(d.baselineDate).getTime() : Date.now();
        var elapsed = (Date.now() - st) / 86400000;
        if (elapsed >= d.interval) due = true;
        else if ((d.interval - elapsed) <= caution().dateDays) soon = true;
      } else {
        var o = cache.odoMap[d.deviceId];
        if (o != null && d.baselineMeters != null) {
          var since = (o - d.baselineMeters)/METERS_PER_UNIT;
          if (since >= d.interval) due = true;
          else if ((d.interval - since) <= soonWindow(d.interval)) soon = true;
        }
      }
      if (!customByDevice[d.deviceId]) customByDevice[d.deviceId] = { due:0, soon:0 };
      if (due) customByDevice[d.deviceId].due++;
      else if (soon) customByDevice[d.deviceId].soon++;
    });

    return devices.map(function (device) {
      var odoMeters = cache.odoMap[device.id];
      var rec = cache.oilMap[device.id];
      var det = rec && rec.details;
      var status, remaining = null;

      if (odoMeters == null) {
        status = "No odometer data";
      } else if (!det) {
        status = "On track";
        remaining = DEFAULT_INTERVAL_MILES;
      } else if (det.enabled === false) {
        status = "Reminders off";
      } else {
        var interval = det.intervalMiles || DEFAULT_INTERVAL_MILES;
        var since = (odoMeters - det.lastNotifiedMeters)/METERS_PER_UNIT;
        remaining = interval - since;
        if (remaining <= 0) status = (globalSettings.autoResetOil === false) ? "Overdue \u2014 awaiting confirmation" : "Due now";
        else if (remaining <= soonWindow(interval)) status = "Due soon";
        else status = "On track";
      }

      var c = customByDevice[device.id];
      if (c) {
        var extras = [];
        if (c.due) extras.push(c.due+" custom due");
        if (c.soon) extras.push(c.soon+" custom due soon");
        if (extras.length) {
          if (status === "On track" && c.due) status = "Due now ("+extras.join(", ")+")";
          else status = status+" ("+extras.join(", ")+")";
        }
      }

      var last = lastServiceFrom(det);
      return {
        deviceId: device.id,
        name: device.name,
        status: status,
        remaining: remaining == null ? null : Math.round(remaining),
        odo: odoMeters == null ? null : Math.round(odoMeters/METERS_PER_UNIT),
        lastDate: last.date,
        lastOdo: last.odoMeters == null ? null : Math.round(last.odoMeters/METERS_PER_UNIT)
      };
    }).sort(function (a,b){ return String(a.name).localeCompare(String(b.name), undefined, {numeric:true}); });
  }

  // Which assets the report covers, per the current draft selection.
  function selectedReportDevices(allDevices, r) {
    if (!r || r.assetMode === "all") return allDevices;
    if (r.assetMode === "assets") {
      var want = {}; (r.deviceIds||[]).forEach(function (id){ want[id]=true; });
      return allDevices.filter(function (d){ return want[d.id]; });
    }
    if (r.assetMode === "groups") {
      // Selecting a parent group must include everything beneath it, so expand
      // each chosen group to its full descendant set before matching.
      var wantG = {};
      (r.groupIds||[]).forEach(function (id) {
        var tree = groupWithDescendants(id);
        Object.keys(tree).forEach(function (gid){ wantG[gid] = true; });
      });
      return allDevices.filter(function (d){ return (deviceGroups[d.id]||[]).some(function (gid){ return wantG[gid]; }); });
    }
    return allDevices;
  }

  function panel(title, note, inner) {
    return '<div style="background:'+C.card+'; border:1px solid '+C.line+'; border-radius:12px; padding:12px 14px; margin-bottom:10px; box-shadow:'+C.shadow+';">' +
      '<div style="font-size:13.5px; font-weight:650; color:'+C.ink+';">'+title+'</div>' +
      (note ? '<div style="font-size:11.5px; color:'+C.soft+'; margin-top:3px; line-height:1.45;">'+note+'</div>' : '') +
      '<div style="margin-top:11px;">'+inner+'</div>' +
    '</div>';
  }
  function fieldLabel(t) {
    return '<div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:'+C.soft+'; margin-bottom:4px;">'+t+'</div>';
  }
  var inputCss = 'padding:6px 9px; border:1px solid '+C.line+'; border-radius:8px; font-size:13px; background:'+C.card2+'; color:'+C.ink+';';
  function toggleRow(id, on, title, desc) {
    return '<label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:9px 0;">' +
      '<input type="checkbox" id="'+id+'" '+(on?"checked":"")+' style="width:16px; height:16px; margin-top:1px; flex:none;">' +
      '<span><span style="font-size:13px; font-weight:600; color:'+C.ink+';">'+title+'</span>' +
      '<div style="font-size:11.5px; color:'+C.soft+'; margin-top:2px; line-height:1.5;">'+desc+'</div></span></label>';
  }

  function renderReport(devices) {
    if (!reportEl) return;

    // back to the top. Grab the scroll offset off the old DOM first.
    var prevScroll = null;
    var prevScrollEl = $("rp-scroll");

    if (!reportDraft) reportDraft = JSON.parse(JSON.stringify(globalSettings.report || DEFAULT_REPORT));

    var names = groupNameMap();

    var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    var onPill = r.enabled
      ? '<span style="font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:'+C.green+'; background:'+C.greenBg+'; border:1px solid '+C.green+'55; border-radius:999px; padding:3px 10px;">Scheduled \u00b7 On</span>'
      : '<span style="font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:'+C.faint+'; background:'+C.track+'; border:1px solid '+C.line+'; border-radius:999px; padding:3px 10px;">Off</span>';
    var schedule =
      '<div style="display:flex; align-items:center; gap:11px; padding:9px 11px; border:1px solid '+(r.enabled?C.green+"44":C.line)+'; border-radius:10px; background:'+C.card2+'; margin-bottom:11px;'+(r.enabled?'':'')+'">' +
        '<input type="checkbox" id="rp-enabled" '+(r.enabled?"checked":"")+' style="width:17px; height:17px; flex:none;">' +
        '<label for="rp-enabled" style="cursor:pointer; flex:1;">' +
          '<span style="font-size:13.5px; font-weight:700; color:'+C.ink+';">Turn on the scheduled fleet report</span>' +
          '<div style="font-size:11.5px; color:'+C.soft+'; margin-top:2px;">Saves the moment you flip it. When off, nothing is emailed on a schedule \u2014 you can still download or send a test below.</div>' +
        '</label>' + onPill +
      '</div>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">' +
        '<label>'+fieldLabel("Frequency")+'<select id="rp-freq" style="'+inputCss+'">' +

        '<label id="rp-dow-wrap" style="'+(r.frequency==="weekly"?"":"display:none;")+'">'+fieldLabel("Day")+'<select id="rp-dow" style="'+inputCss+'">' +
          DAYS.map(function (d,i){ return '<option value="'+i+'"'+(Number(r.dayOfWeek)===i?" selected":"")+'>'+d+'</option>'; }).join("") +
        '</select></label>' +
        '<label>'+fieldLabel("Time")+'<input id="rp-time" type="time" value="'+esc(r.time||"07:00")+'" style="'+inputCss+'"></label>' +
        '<label>'+fieldLabel("Time zone")+'<select id="rp-tz" style="'+inputCss+'">' +
          TZS.map(function (t){ return '<option value="'+esc(t)+'"'+(r.timezone===t?" selected":"")+'>'+esc(t)+'</option>'; }).join("") +
        '</select></label>' +
        '<label style="flex:1; min-width:220px;">'+fieldLabel("Send to")+'<input id="rp-to" type="text" value="'+esc(r.recipients||"")+'" placeholder="comma-separated; blank uses the fleet default" style="'+inputCss+' width:100%;"></label>' +
      '</div>' +
      (r.lastSentAt ? '<div style="font-size:11px; color:'+C.faint+'; margin-top:9px;">Last sent '+new Date(r.lastSentAt).toLocaleString()+'</div>' : '');

    // ---- asset selection panel ----
    var selected = selectedReportDevices(all, r);
    var selIds = {}; selected.forEach(function (d){ selIds[d.id]=true; });

    // Every mode gets an explicit "add these to the list" action on the right,
    // so you're never stuck able to add only via the group dropdown.
    var addBtnCss = 'border:1px solid '+C.brand+'59; background:'+C.brandSoft+'; color:'+C.brand+'; border-radius:7px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:pointer;';
    var actionBtn = "";
    if (r.assetMode === "all") {
      actionBtn = '<button id="rp-addall" style="'+addBtnCss+'">Add all '+all.length+' assets to the list</button>';
    } else if (r.assetMode === "groups") {
      var canAdd = selected.length > 0;
      var gBtnCss = canAdd ? addBtnCss
        : 'border:1px solid '+C.line+'; background:transparent; color:'+C.faint+'; border-radius:8px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:not-allowed;';
      actionBtn = '<button id="rp-addgroups"'+(canAdd?"":" disabled")+' style="'+gBtnCss+'">Add these '+selected.length+' asset'+(selected.length===1?"":"s")+' to the list</button>';
    } else if (r.assetMode === "assets") {
      // The ticked boxes already *are* the list here, so the action is to commit
      // it — otherwise you'd have to scroll to Save schedule at the bottom.
      var canSave = selected.length > 0;
      var sBtnCss = canSave ? addBtnCss
        : 'border:1px solid '+C.line+'; background:transparent; color:'+C.faint+'; border-radius:8px; padding:5px 12px; font-size:12.5px; font-weight:650; cursor:not-allowed;';
      actionBtn = '<button id="rp-saveassets"'+(canSave?"":" disabled")+' style="'+sBtnCss+'">Save these '+selected.length+' asset'+(selected.length===1?"":"s")+'</button>';

    var modeRow =
      '<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">' +
        '<label>'+fieldLabel("Include")+'<select id="rp-mode" style="'+inputCss+'">' +
          '<option value="all"'+(r.assetMode==="all"?" selected":"")+'>Entire fleet</option>' +
          '<option value="groups"'+(r.assetMode==="groups"?" selected":"")+'>Selected groups</option>' +
          '<option value="assets"'+(r.assetMode==="assets"?" selected":"")+'>Selected assets</option>' +
        '</select></label>' +
        '<div style="flex:1;"></div>' +
        '<div style="display:flex; gap:9px; align-items:center;">' +
          actionBtn +
          '<span style="font-size:12px; color:'+(selected.length?C.green:C.red)+'; font-weight:650; font-variant-numeric:tabular-nums;">'+selected.length+' of '+all.length+' asset'+(all.length===1?"":"s")+' included</span>' +
        '</div>' +
      '</div>';

    var picker = "";
    if (r.assetMode === "all") {
      picker = '<div style="margin-top:11px; font-size:12px; color:'+C.soft+'; line-height:1.55;">' +
        'Every asset in the database is included, and any vehicle added later is picked up automatically. ' +
        'Use the button above if you\u2019d rather freeze the list and remove a few by hand.</div>';
    } else if (r.assetMode === "groups") {
      var gsel = {}; (r.groupIds||[]).forEach(function (id){ gsel[id]=true; });
      // Most Geotab databases carry a pile of driver/activity classification
      // groups that contain no vehicles at all. Ticking those can never add an
      // asset, so hide them by default — that's the whole reason the Add button
      // used to sit there reading "Add these 0 assets".
      var groupRows = "";
      var emptyHidden = 0;
      walkGroupTree(function (gid, gname, depth) {
        var count = devicesInGroup(all, gid).length;
        var on = !!gsel[gid];
        if (!count && !showEmptyGroups && !on) { emptyHidden++; return; }
        groupRows +=
          '<label style="display:flex; align-items:center; gap:9px; padding:5px 8px; padding-left:'+(8 + depth*20)+'px; border-radius:7px; cursor:'+(count?'pointer':'default')+'; background:'+(on?C.brandSoft:"transparent")+';">' +
            (depth ? '<span style="color:'+C.faint+'; font-size:11px; margin-left:-13px; width:9px;">\u2514</span>' : '') +
            '<input type="checkbox" data-rpgroup="'+esc(gid)+'" '+(on?"checked":"")+(count?"":" disabled")+' style="width:15px;height:15px; flex:none;'+(count?"":" opacity:.35;")+'">' +
            '<span style="font-size:13px; color:'+(count?C.ink:C.faint)+'; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(gname)+'</span>' +

    } else if (r.assetMode === "assets") {
      var dsel = {}; (r.deviceIds||[]).forEach(function (id){ dsel[id]=true; });

      var shown = all.filter(function (d){ return !ft || String(d.name||"").toLowerCase().indexOf(ft) >= 0; });
      // group the asset list under its Geotab group so the tree is still visible
      var byGroup = {}, groupOrder = [];
      shown.forEach(function (d) {
        var g = devicePrimaryGroup(d.id);
        var key = g.path && g.path.length ? g.path.join(" \u203a ") : (g.name || "Ungrouped");
        if (!byGroup[key]) { byGroup[key] = []; groupOrder.push(key); }
        byGroup[key].push(d);
      });
      groupOrder.sort(function (a,b){ return a.localeCompare(b); });
      var assetRows = groupOrder.map(function (key) {
        var list = byGroup[key].slice().sort(function (a,b){ return String(a.name).localeCompare(String(b.name), undefined, {numeric:true}); });
        var onCount = list.filter(function (d){ return dsel[d.id]; }).length;
        return '<div style="display:flex; align-items:center; gap:8px; padding:7px 8px 4px;">' +
            '<span style="font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:'+C.brand+';">'+esc(key)+'</span>' +

          list.map(function (d) {

      picker =
        '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:11px;">' +
          '<input id="rp-search" type="text" value="'+esc(assetFilterText)+'" placeholder="Filter assets\u2026" style="'+inputCss+' flex:1; min-width:170px;">' +
          '<button id="rp-all" style="'+addBtnCss+'">Select all'+(ft?" shown":"")+'</button>' +
          '<button id="rp-none" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:600; cursor:pointer;">Clear</button>' +
          '<select id="rp-addgroup" style="'+inputCss+'"><option value="">+ Add a whole group\u2026</option>' +
            (function () { var o = ""; walkGroupTree(function (gid, gname, depth) {
              var c = devicesInGroup(all, gid).length;
              if (!c) return; // an empty group can't add anything
              o += '<option value="'+esc(gid)+'">'+"\u00a0\u00a0".repeat(depth)+esc(gname)+' ('+c+')</option>';
            }); return o; })() +
          '</select>' +
        '</div>' +
        '<div id="rp-scroll" style="margin-top:9px; max-height:320px; overflow:auto; border:1px solid '+C.line+'; border-radius:9px; padding:5px; background:'+C.card2+';">' +
          (assetRows || '<div style="padding:12px; color:'+C.soft+'; font-size:12.5px;">No assets match that filter.</div>') + '</div>';
    }

    // ---- preview panel ----
    var rows = buildReportRows(selected);
    var td = 'padding:5px 9px; border-top:1px solid '+C.line+';';
    var previewRows = rows.map(function (x) {
      return '<tr>' +
        '<td style="'+td+' color:'+C.ink+'; white-space:nowrap;">'+esc(x.name)+'</td>' +
        '<td style="'+td+' color:'+C.soft+';">'+esc(x.status)+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.remaining==null?"\u2014":fmt(x.remaining))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.odo==null?"\u2014":fmt(x.odo))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; white-space:nowrap;">'+esc(fmtServiceDate(x.lastDate))+'</td>' +
        '<td style="'+td+' color:'+C.soft+'; text-align:right; font-variant-numeric:tabular-nums;">'+(x.lastOdo==null?"\u2014":fmt(x.lastOdo))+'</td>' +
      '</tr>';
    }).join("");
    // Sticky header + its own scroll area, so every selected asset is reachable
    // no matter how long the list is.
    var th = 'position:sticky; top:0; z-index:1; background:'+C.card2+'; padding:6px 9px; font-size:10.5px; font-weight:700; ' +
             'text-transform:uppercase; letter-spacing:.05em; color:'+C.faint+'; text-align:left; border-bottom:1px solid '+C.line+';';
    var queued = !!(r.testPending || r.sendNow);
    var preview =
      '<div style="max-height:330px; overflow:auto; border:1px solid '+C.line+'; border-radius:9px; background:'+C.card2+';">' +
      '<table style="width:100%; border-collapse:collapse; font-size:12.5px;"><thead><tr>' +
        '<th style="'+th+'">Asset</th><th style="'+th+'">Status</th>' +
        '<th style="'+th+' text-align:right;">Mi. remaining</th><th style="'+th+' text-align:right;">Odometer</th>' +
        '<th style="'+th+'">Last oil change</th><th style="'+th+' text-align:right;">At odometer</th>' +
      '</tr></thead><tbody>'+(previewRows || '<tr><td colspan="6" style="padding:12px; color:'+C.soft+';">No assets selected.</td></tr>')+'</tbody></table></div>' +
      '<div style="font-size:11px; color:'+C.faint+'; margin-top:7px;">' +
        (rows.length ? rows.length + ' row' + (rows.length===1?'':'s') + ' \u2014 exactly what sheet 1 of the workbook will contain.' + (rows.length > 8 ? ' Scroll inside the table to see them all.' : '') : '') +
      '</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center;">' +
        '<button id="rp-save" style="border:none; background:'+C.brand+'; color:'+C.onBrand+'; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:650; cursor:pointer;">Save schedule</button>' +
        '<button id="rp-csv" style="border:1px solid '+C.line+'; background:transparent; color:'+C.ink+'; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;">Download CSV now</button>' +
        '<button id="rp-emailnow"' + (queued ? ' disabled' : '') + ' style="border:1px solid ' + (queued ? C.line : C.brand+'8c') + '; background:' + (queued ? 'transparent' : C.brandSoft) + '; color:' + (queued ? C.faint : C.brand) + '; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:650; cursor:' + (queued ? 'default' : 'pointer') + ';">' + (queued ? 'Email queued' : 'Email report now') + '</button>' +
        (queued ? '<button id="rp-cancelnow" style="border:1px solid '+C.line+'; background:transparent; color:'+C.soft+'; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;">Cancel</button>' : '') +
      '</div>' +
      (queued
        ? '<div style="margin-top:10px; background:'+C.brandSoft+'; border:1px solid '+C.brand+'55; border-radius:9px; padding:9px 12px; font-size:12px; color:'+C.brand+'; line-height:1.5;">' +
          'Queued. The spreadsheet is built and sent by the automation job, so it goes out on that job\u2019s next run. ' +
          '<span style="color:'+C.soft+';">To send it immediately, open the repo\u2019s Actions tab and run the workflow manually.</span></div>'
        : '<div style="margin-top:9px; font-size:11px; color:'+C.faint+'; line-height:1.5;">' +
          '\u201cEmail report now\u201d hands the job to the automation script \u2014 the Add-In runs in your browser and can\u2019t send mail itself. ' +
          'For an instant copy, use Download CSV.</div>');

    reportEl.innerHTML =
      panel("Schedule",
        "The Excel file is built and emailed by the automation script. It fires on the first scheduled run at or after this time, and only once per period \u2014 so the report can never double-send even if the job runs hourly.",
        schedule) +
      panel("Assets in the report", "Pick the whole fleet, one or more groups, or individual assets.", modeRow + picker) +
      panel("Columns &amp; preview", "The workbook has two sheets. <b>Fleet Summary</b>: asset, status, mileage remaining before oil change, odometer, and when the last oil change was done and at what mileage. <b>Service History</b>: every service on every asset \u2014 the oil change plus each custom reminder \u2014 with its interval, status, and last completion. Preview below shows sheet 1 from currently loaded data.", preview);

    // put the list back where it was before the re-render
    if (prevScroll != null) {
      var newScrollEl = $("rp-scroll");
      if (newScrollEl) newScrollEl.scrollTop = prevScroll;
    }

    // ---- wiring ----
    function bindVal(id, key, transform) {
      var el = $(id); if (!el) return;
      el.addEventListener("change", function () {
        r[key] = transform ? transform(el.value) : el.value;
        renderReport(devices);
      });
    }
    var en = $("rp-enabled");
    if (en) en.addEventListener("change", function () {
      var val = en.checked;
      if (val && !(r.recipients||"").trim() && !(globalSettings.defaultEmailTo||"").trim()) {
        en.checked = false;
        toast("Set report recipients, or a fleet default in Settings, before turning this on");
        return;
      }
      if (val && !selectedReportDevices(all, r).length) {
        en.checked = false; toast("Select at least one asset before turning this on"); return;
      }
      r.enabled = val;
      // Flip-to-save: this is the master switch, so don't make it wait for Save.
      patchSettings({ report: JSON.parse(JSON.stringify(r)) })
        .then(function () { toast(val ? "Scheduled fleet report is ON" : "Scheduled fleet report turned off"); renderReport(devices); })
        .catch(function (e){ r.enabled = !val; toast("Save failed: "+(e&&e.message?e.message:e)); renderReport(devices); });
    });
    bindVal("rp-freq", "frequency");
    bindVal("rp-dow", "dayOfWeek", Number);
    bindVal("rp-tz", "timezone");
    var tm = $("rp-time"); if (tm) tm.addEventListener("change", function () { r.time = tm.value || "07:00"; });
    var to = $("rp-to"); if (to) to.addEventListener("change", function () { r.recipients = to.value.trim(); });
    bindVal("rp-mode", "assetMode");

    reportEl.querySelectorAll("[data-rpgroup]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-rpgroup");
        var set = (r.groupIds||[]).filter(function (x){ return x !== id; });
        if (cb.checked) set.push(id);
        r.groupIds = set; renderReport(devices);
      });
    });
    reportEl.querySelectorAll("[data-rpasset]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-rpasset");
        var set = (r.deviceIds||[]).filter(function (x){ return x !== id; });
        if (cb.checked) set.push(id);
        r.deviceIds = set; renderReport(devices);
      });
    });
    var addAll = $("rp-addall");
    if (addAll) addAll.addEventListener("click", function () {
      r.deviceIds = all.map(function (d){ return d.id; });
      r.assetMode = "assets";
      toast("Added all "+r.deviceIds.length+" assets \u2014 uncheck any you don\u2019t want");
      renderReport(devices);
    });
    var addGroups = $("rp-addgroups");
    if (addGroups) addGroups.addEventListener("click", function () {
      if (!selected.length) { toast("Select at least one group first"); return; }
      r.deviceIds = selected.map(function (d){ return d.id; });
      r.assetMode = "assets";
      toast("Added "+r.deviceIds.length+" asset"+(r.deviceIds.length===1?"":"s")+" from the selected group(s)");
      renderReport(devices);
    });
    var saveAssets = $("rp-saveassets");
    if (saveAssets) saveAssets.addEventListener("click", function () {
      if (!selected.length) { toast("Tick at least one asset first"); return; }
      commitReport("Saved \u2014 "+selected.length+" asset"+(selected.length===1?"":"s")+" in the report");
    });
    var gclear = $("rp-gclear");
    if (gclear) gclear.addEventListener("click", function () { r.groupIds = []; renderReport(devices); });
    var gempty = $("rp-gempty");
    if (gempty) gempty.addEventListener("click", function () { showEmptyGroups = !showEmptyGroups; renderReport(devices); });

    reportEl.querySelectorAll("[data-rpgpick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-rpgpick");
        var ft3 = assetFilterText.toLowerCase();
        var list = all.filter(function (d) {
          if (ft3 && String(d.name||"").toLowerCase().indexOf(ft3) < 0) return false;
          var g = devicePrimaryGroup(d.id);
          var k = g.path && g.path.length ? g.path.join(" \u203a ") : (g.name || "Ungrouped");
          return k === key;
        });
        var cur = (r.deviceIds||[]).slice();
        var allOn = list.every(function (d){ return cur.indexOf(d.id) >= 0; });
        if (allOn) {
          var drop = {}; list.forEach(function (d){ drop[d.id] = true; });
          r.deviceIds = cur.filter(function (id){ return !drop[id]; });
        } else {
          list.forEach(function (d){ if (cur.indexOf(d.id) < 0) cur.push(d.id); });
          r.deviceIds = cur;
        }
        renderReport(devices);
      });
    });

    var search = $("rp-search");
    if (search) {
      search.addEventListener("input", function () {
        assetFilterText = search.value;
        renderReport(devices);
        var s2 = $("rp-search");
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      });
    }
    var selAll = $("rp-all");
    if (selAll) selAll.addEventListener("click", function () {
      var ft2 = assetFilterText.toLowerCase();
      var ids = all.filter(function (d){ return !ft2 || String(d.name||"").toLowerCase().indexOf(ft2) >= 0; }).map(function (d){ return d.id; });
      var merged = (r.deviceIds||[]).slice();
      ids.forEach(function (id){ if (merged.indexOf(id) < 0) merged.push(id); });
      r.deviceIds = merged; renderReport(devices);

    var selNone = $("rp-none");

      var gid = addGroup.value; if (!gid) return;
